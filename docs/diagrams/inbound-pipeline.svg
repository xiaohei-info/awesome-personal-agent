" y="136" width="208" height="66" rx="8" fill="#0f172a"/><rect x="412" y="136" width="208" height="66" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/><text x="516.0" y="164" fill="#e2e8f0" font-size="13" text-anchor="middle">重复事件：丢弃</text><text x="516.0" y="186" fill="#94a3b8" font-size="12" text-anchor="middle">不产生重复事项</text><rect x="72" y="248" width="300" height="66" rx="8" fill="#0f172a"/><rect x="72" y="248" width="300" height="66" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="222.0" y="276" fill="white" font-size="15" font-weight="700" text-anchor="middle">② 归属</text><text x="222.0" y="298" fill="#94a3b8" font-size="13" text-anchor="middle">按关联键找未关闭的事项</text><rect x="412" y="248" width="208" height="66" rx="8" fill="#0f172a"/><rect x="412" y="248" width="208" height="66" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/><text x="516.0" y="276" fill="#e2e8f0" font-size="13" text-anchor="middle">命中：回到原事项</text><text x="516.0" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">挂靠、刷新，或唤回等待</text><rect x="72" y="360" width="300" height="66" rx="8" fill="#0f172a"/><rect x="72" y="360" width="300" height="66" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="222.0" y="388" fill="white" font-size="15" font-weight="700" text-anchor="middle">③ 确定性规则</text><text x="222.0" y="410" fill="#94a3b8" font-size="13" text-anchor="middle">类型、发送者、数值与变化条件</text><rect x="412" y="360" width="208" height="66" rx="8" fill="#0f172a"/><rect x="412" y="360" width="208" height="66" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/><text x="516.0" y="388" fill="#e2e8f0" font-size="13" text-anchor="middle">忽略 · 汇入简报 · 提醒</text><text x="516.0" y="410" fill="#94a3b8" font-size="12" text-anchor="middle">不进建议流</text><rect x="72" y="472" width="300" height="66" rx="8" fill="#0f172a"/><rect x="72" y="472" width="300" height="66" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/><text x="222.0" y="500" fill="white" font-size="15" font-weight="700" text-anchor="middle">④ 初筛 · 分类端点</text><text x="222.0" y="522" fill="#94a3b8" font-size="13" text-anchor="middle">值得看吗：只回概率，可批量</text><rect x="412" y="472" width="208" height="66" rx="8" fill="#0f172a"/><rect x="412" y="472" width="208" height="66" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4"/><text x="516.0" y="500" fill="#e2e8f0" font-size="13" text-anchor="middle">低于下限：忽略</text><text x="516.0" y="522" fill="#94a3b8" font-size="12" text-anchor="middle">留痕，进抽检池</text><rect x="72" y="584" width="300" height="66" rx="8" fill="#0f172a"/><rect x="72" y="584" width="300" height="66" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="222.0" y="612" fill="white" font-size="15" font-weight="700" text-anchor="middle">④ 初筛 · 对话端点</text><text x="222.0" y="634" fill="#94a3b8" font-size="13" text-anchor="middle">同一道题重答，不自报置信度</text><rect x="412" y="584" width="208" height="66" rx="8" fill="#0f172a"/><rect x="412" y="584" width="208" height="66" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,4"/><text x="516.0" y="612" fill="#e2e8f0" font-size="13" text-anchor="middle">否且资料足够：忽略</text><text x="516.0" y="634" fill="#94a3b8" font-size="12" text-anchor="middle">留痕，进抽检池</text><rect x="72" y="696" width="300" height="66" rx="8" fill="#0f172a"/><rect x="72" y="696" width="300" height="66" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="222.0" y="724" fill="white" font-size="15" font-weight="700" text-anchor="middle">⑤ 起草 · 生成型</text><text x="222.0" y="746" fill="#94a3b8" font-size="13" text-anchor="middle">标题、摘要、类别、项目、推荐</text><rect x="72" y="808" width="300" height="66" rx="8" fill="#0f172a"/><rect x="72" y="808" width="300" height="66" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="222.0" y="836" fill="white" font-size="15" font-weight="700" text-anchor="middle">⑥ 合并键</text><text x="222.0" y="858" fill="#94a3b8" font-size="13" text-anchor="middle">同一件事只留一条建议</text><rect x="72" y="920" width="300" height="66" rx="8" fill="#0f172a"/><rect x="72" y="920" width="300" height="66" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="222.0" y="948" fill="white" font-size="15" font-weight="700" text-anchor="middle">建议流（本人处置）</text><text x="222.0" y="970" fill="#94a3b8" font-size="13" text-anchor="middle">接受 · 补到已有事项 · 忽略</text><rect x="10" y="1020" width="610" height="126" rx="8" fill="#0f172a"/><rect x="10" y="1020" width="610" height="126" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/><text x="26" y="1048" fill="white" font-size="15" font-weight="700">不可用时与留痕</text><text x="26" y="1072" fill="#e2e8f0" font-size="13">没有判断端点：初筛由对话端点直接回答同一道题</text><text x="26" y="1093" fill="#e2e8f0" font-size="13">两个端点都不可用：记为未判定，恢复后重判，不直接进建议流</text><text x="26" y="1114" fill="#e2e8f0" font-size="13">含多件事的事件与对话增量：预筛后抽取多条候选，各进第 ⑥ 步</text><text x="26" y="1135" fill="#e2e8f0" font-size="13">每一级的结果写入判断记录，可回放、可计数、可校准</text><text x="236.0" y="230.0" fill="#cbd5e1" font-size="13">新事件</text><text x="236.0" y="342.0" fill="#cbd5e1" font-size="13">未命中</text><text x="236.0" y="454.0" fill="#cbd5e1" font-size="13">规则判不了</text><text x="236.0" y="566.0" fill="#cbd5e1" font-size="13">概率在不确定带内</text><text x="236.0" y="678.0" fill="#cbd5e1" font-size="13">是，或各级未定（标把握低）</text><text x="56" y="566.0" fill="#34d399" font-size="13">高于上限：直通</text><text x="26" y="454.0" fill="#94a3b8" font-size="13">结构化事件：直接成建议</text><text x="10" y="1210" fill="#64748b" font-size="12">虚线框：流水线的出口。被忽略的事件留在来源页，可抽检、可捞回。</text><rect x="10" y="1171" width="18" height="13" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.2"/><text x="36" y="1182" fill="#94a3b8" font-size="12">确定性规则</text><rect x="119" y="1171" width="18" height="13" rx="3" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.2"/><text x="145" y="1182" fill="#94a3b8" font-size="12">分类端点</text><rect x="215" y="1171" width="18" height="13" rx="3" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.2"/><text x="241" y="1182" fill="#94a3b8" font-size="12">对话端点</text><rect x="311" y="1171" width="18" height="13" rx="3" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.2"/><text x="337" y="1182" fill="#94a3b8" font-size="12">本人</text></svg>
