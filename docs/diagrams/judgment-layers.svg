<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1408" width="600" height="1408" font-family="'JetBrains Mono','WenQuanYi Zen Hei','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arr-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#fb7185"/></marker><marker id="arr-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#fbbf24"/></marker><marker id="arr-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#fb923c"/></marker><marker id="arr-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#22d3ee"/></marker><marker id="arr-emerald" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#34d399"/></marker><marker id="arr-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/></marker><marker id="arr-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#a78bfa"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern></defs><rect width="600" height="1408" fill="#020617"/><rect width="600" height="1408" fill="url(#grid)"/><line x1="56" y1="170" x2="56" y2="123" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arr-rose)"/><line x1="56" y1="316" x2="56" y2="269" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)"/><line x1="56" y1="628" x2="56" y2="581" stroke="#fb923c" stroke-width="1.8" marker-end="url(#arr-orange)"/><line x1="56" y1="774" x2="56" y2="727" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-cyan)"/><line x1="56" y1="920" x2="56" y2="873" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-cyan)"/><line x1="56" y1="1066" x2="56" y2="1019" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-emerald)"/><line x1="56" y1="1212" x2="56" y2="1165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><path d="M 540 530.0 L 572 530.0 L 572 72.0 L 543 72.0" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr-rose)"/><line x1="20" y1="447.0" x2="540" y2="447.0" stroke="#475569" stroke-width="1" stroke-dasharray="3,5"/><rect x="20" y="24" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="24" width="520" height="96" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="36" y="53" fill="white" font-size="16" font-weight="700">本人</text><text x="526" y="53" fill="#fb7185" font-size="12" text-anchor="end">最贵的资源：注意力</text><text x="36" y="80" fill="#e2e8f0" font-size="14">管：定目标、批准规则与门槛、确认高风险、处置未定项</text><text x="36" y="104" fill="#94a3b8" font-size="14">不管：逐条筛选、盯进度、重复交代背景</text><rect x="20" y="170" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="170" width="520" height="96" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="36" y="199" fill="white" font-size="16" font-weight="700">主会话 agent（对话面）</text><text x="526" y="199" fill="#fbbf24" font-size="12" text-anchor="end">会话在线时</text><text x="36" y="226" fill="#e2e8f0" font-size="14">管：把本人的话变成账本操作；带上下文起草方案和提问</text><text x="36" y="250" fill="#94a3b8" font-size="14">不管：凭自己的判断替本人决定；充当后台调度</text><rect x="20" y="316" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="316" width="520" height="96" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="36" y="345" fill="white" font-size="16" font-weight="700">执行者 agent（执行面）</text><text x="526" y="345" fill="#fbbf24" font-size="12" text-anchor="end">分钟到小时</text><text x="36" y="372" fill="#e2e8f0" font-size="14">管：完成被委派的工作，回执附结果证据</text><text x="36" y="396" fill="#94a3b8" font-size="14">不管：决定做不做；改不属于自己的事项；代答</text><rect x="20" y="482" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="482" width="520" height="96" rx="8" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/><text x="36" y="511" fill="white" font-size="16" font-weight="700">任务型（无头拉起的一次性运行）</text><text x="526" y="511" fill="#fb923c" font-size="12" text-anchor="end">分钟级</text><text x="36" y="538" fill="#e2e8f0" font-size="14">管：要工具或读资料的产出：简报、例行任务、规范起草</text><text x="36" y="562" fill="#94a3b8" font-size="14">不管：和本人对话；代答；常驻；失败后自行重试</text><rect x="20" y="628" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="628" width="520" height="96" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="36" y="657" fill="white" font-size="16" font-weight="700">生成型（单次调用，无工具）</text><text x="526" y="657" fill="#22d3ee" font-size="12" text-anchor="end">秒级</text><text x="36" y="684" fill="#e2e8f0" font-size="14">管：所有要写的：标题、摘要、卡片、候选；从清单里选</text><text x="36" y="708" fill="#94a3b8" font-size="14">不管：查证外部事实；改状态；放宽任何门槛</text><rect x="20" y="774" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="774" width="520" height="96" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="36" y="803" fill="white" font-size="16" font-weight="700">判断型 · 对话端点</text><text x="526" y="803" fill="#22d3ee" font-size="12" text-anchor="end">秒级</text><text x="36" y="830" fill="#e2e8f0" font-size="14">管：同题重答；选择题与打分题；自报资料够不够</text><text x="36" y="854" fill="#94a3b8" font-size="14">不管：自报置信度；查证外部事实；放宽任何门槛</text><rect x="20" y="920" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="920" width="520" height="96" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/><text x="36" y="949" fill="white" font-size="16" font-weight="700">判断型 · 分类端点（只回概率）</text><text x="526" y="949" fill="#34d399" font-size="12" text-anchor="end">亚秒级，可批量</text><text x="36" y="976" fill="#e2e8f0" font-size="14">管：高量是非题的筛选、排序与门控；只收紧不放松</text><text x="36" y="1000" fill="#94a3b8" font-size="14">不管：产出文本；多步推理；放行类或不可逆的决定</text><rect x="20" y="1066" width="520" height="96" rx="8" fill="#0f172a"/><rect x="20" y="1066" width="520" height="96" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="36" y="1095" fill="white" font-size="16" font-weight="700">确定性规则</text><text x="526" y="1095" fill="#94a3b8" font-size="12" text-anchor="end">即时</text><text x="36" y="1122" fill="#e2e8f0" font-size="14">管：去重、归属、结构化映射、权限与安全硬约束</text><text x="36" y="1146" fill="#94a3b8" font-size="14">不管：语义判断；判不了就交上一级，不猜</text><rect x="20" y="1212" width="520" height="76" rx="8" fill="#0f172a"/><rect x="20" y="1212" width="520" height="76" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="36" y="1241" fill="white" font-size="16" font-weight="700">账本与时钟（唯一事实来源）</text><text x="36" y="1268" fill="#e2e8f0" font-size="14">各层只产出建议或回执；经命令模型落账后才成为事实</text><text x="74" y="150.0" fill="#fb7185" font-size="13">代答须附本人原话或授权单；高风险只在 Web 确认</text><text x="74" y="296.0" fill="#fbbf24" font-size="13">回执附结果证据；卡住就提问</text><text x="74" y="608.0" fill="#fb923c" font-size="13">接力：信息不足或需要查证，换成带工具的任务</text><text x="74" y="754.0" fill="#22d3ee" font-size="13">接力：定案之后要写东西，换成生成型的模板</text><text x="74" y="900.0" fill="#22d3ee" font-size="13">同题升级：概率落在不确定带，同一道题重答</text><text x="74" y="1046.0" fill="#34d399" font-size="13">规则判不了，且是自由文本上的是非题</text><text x="74" y="1192.0" fill="#94a3b8" font-size="13">来源事件、到期、回执等事实触发判断</text><text x="20" y="437.0" fill="#fbbf24" font-size="12">▲ 在宿主 harness 内运行</text><text x="20" y="468.0" fill="#94a3b8" font-size="12">▼ 由内核按能力包调用，无状态</text><text x="540" y="437.0" fill="#fb7185" font-size="12" text-anchor="end">失败或各级未定：转待决策，交本人 ▲</text><text x="20" y="1384" fill="#64748b" font-size="12">实线箭头：同题升级或接力；虚线：兜底交本人。右上角为时延量级（估计）。</text><rect x="20" y="1317" width="18" height="13" rx="3" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.2"/><text x="46" y="1328" fill="#94a3b8" font-size="12">本人</text><rect x="90" y="1317" width="18" height="13" rx="3" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.2"/><text x="116" y="1328" fill="#94a3b8" font-size="12">宿主内的 agent</text><rect x="264" y="1317" width="18" height="13" rx="3" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.2"/><text x="290" y="1328" fill="#94a3b8" font-size="12">任务型</text><rect x="347" y="1317" width="18" height="13" rx="3" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.2"/><text x="373" y="1328" fill="#94a3b8" font-size="12">对话端点上的两类</text><rect x="20" y="1343" width="18" height="13" rx="3" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.2"/><text x="46" y="1354" fill="#94a3b8" font-size="12">分类端点</text><rect x="116" y="1343" width="18" height="13" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.2"/><text x="142" y="1354" fill="#94a3b8" font-size="12">规则</text><rect x="186" y="1343" width="18" height="13" rx="3" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.2"/><text x="212" y="1354" fill="#94a3b8" font-size="12">账本</text></svg>
