name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['.omac/**']
  pull_request:
    paths-ignore: ['.omac/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web run test -- --run src/app
      - run: python3 -m pip install pytest  # ACT-DLG-06 跑 plugins/hermes/tests/receipt 契约测试
      - run: go build ./...
      - run: go test ./...
      - run: go run ./tools/redline
