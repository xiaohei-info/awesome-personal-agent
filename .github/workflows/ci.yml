name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['.omac/**']
  pull_request:
    paths-ignore: ['.omac/**']

permissions:
  contents: read

# 同一 ref 上的新运行取消旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web run test -- --run src/app
      - run: python3 -m pip install pytest  # ACT-DLG-06 跑 plugins/hermes/tests/receipt 契约测试
      - run: go build ./...
      - run: go test ./...
      - run: go run ./tools/redline
      - run: .github/e2e/pkgs.sh check  # e2e 分组与 tests/e2e 目录保持一致

  # 冒烟 e2e：与 build 并行；固定包清单（.github/e2e/smoke.txt），不按改动路径选包。
  # 全量 e2e 只在发版时跑，见 release.yml
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/fixtures/ledger/fetch-v01.sh 读冻结提交，浅克隆会 exit 3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build  # e2e 起的真实 apa serve 内嵌 web/dist/index.html
      - run: sudo apt-get install -y sqlite3  # 账本断言使用真实 sqlite3 CLI
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid  # 用例在临时仓库里 git commit，runner 没有默认身份
      - run: python3 -m pip install pytest  # hermes 插件契约测试
      - run: go test -tags e2e -count=1 -timeout 12m $(.github/e2e/pkgs.sh smoke)
