name: inbound-triage
version: 1.0.0
description: 来源事件变成建议：GitHub、邮件、日历的来源规则，webhook 校验与映射，判断型与生成型提示词
# 邮件和日历的项目归属随用户而定（项目 id 由本机生成）：在数据目录放同名包，把 project_by 改成 "fixed:<项目 id>"。
source_rules:
  - id: github-issue
    match: {source_type: github, event_type: [issue.opened, issue.labeled]}
    project_by: repo_remote
    then: judge
  - id: calendar-event
    match: {source_type: calendar, event_type: [event.created, event.updated]}
    kind: task
    project_by: none
    then: proposed
  - id: mail-received
    match: {source_type: mail, event_type: [mail.received]}
    project_by: none
    then: judge
    on_update: attach
  # 结构化规则：不调模型。PR 的合并、关闭与更新能按关联键挂靠的，已在规则之前挂靠；走到这里的没有事项登记过关联键。
  - id: reminder-due
    match: {source_type: reminder, event_type: [reminder.due]}
    kind: task
    project_by: none
    then: proposed
  # 没有到期日的提醒事项只在来源配了 undated_lists 时才有；同样直接成为建议。
  - id: reminder-open
    match: {source_type: reminder, event_type: [reminder.open]}
    kind: task
    project_by: none
    then: proposed
  # 提醒离开了未完成集合：核实为已完成（reminder.completed），或只是移出拉取范围、已读不到（reminder.out_of_view，不表示完成）。
  # 挂到它建出的事项上作为后续消息，不改标题与正文，不关闭事项；没有事项的不处理。
  - id: reminder-status
    match: {source_type: reminder, event_type: [reminder.completed, reminder.out_of_view]}
    then: ignore
    on_update: attach
  - id: agents-md-changed
    match: {source_type: github, event_type: [repo.agents_md_changed]}
    then: ignore
  - id: pr-activity
    match: {source_type: github, event_type: [pr.merged, pr.closed, pr.updated]}
    then: ignore
  # 评论与评审是关于对象的消息，不是对象本身的更新：挂到已有事项时只记为后续消息，不改标题、正文与摘要（§9.4）。
  - id: pr-discussion
    match: {source_type: github, event_type: [pr.commented, pr.review_commented, pr.reviewed]}
    then: ignore
    on_update: attach
  - id: issue-comment
    match: {source_type: github, event_type: [issue.commented]}
    then: judge
    on_update: attach
webhook_schemes:
  - id: hmac-sha256-header
    signature_header: X-Hub-Signature-256
    signature_prefix: "sha256="
    algorithm: hmac-sha256
    signed_payload: body
    delivery_id_header: X-GitHub-Delivery
webhook_mappings:
  - id: github-issues
    match: {header: {X-GitHub-Event: issues}}
    fields:
      id: "{header.X-GitHub-Delivery}"
      type: "issue.{$.action}"
      subject: "{$.issue.title}"
      summary: "{$.issue.body}"
      link: "{$.issue.html_url}"
      occurred_at: "{$.issue.updated_at}"
      correlation_keys: ["{$.repository.full_name}#{$.issue.number}"]
      sender: "{$.sender.login}"
    sender_verified: on_signature
  # 评论与评审只取新建（created、submitted）：编辑和删除不产生新事件。issue_comment 不区分 issue 与 PR，一律 issue.commented。
  - id: github-issue-comments
    match: {header: {X-GitHub-Event: issue_comment}, json_path: "$.action", equals: created}
    fields:
      id: "{header.X-GitHub-Delivery}"
      type: issue.commented
      subject: "{$.issue.title}"
      summary: "{$.comment.body}"
      link: "{$.comment.html_url}"
      occurred_at: "{$.comment.created_at}"
      correlation_keys: ["{$.repository.full_name}#{$.issue.number}"]
      sender: "{$.sender.login}"
    sender_verified: on_signature
  - id: github-pr-reviews
    match: {header: {X-GitHub-Event: pull_request_review}, json_path: "$.action", equals: submitted}
    fields:
      id: "{header.X-GitHub-Delivery}"
      type: pr.reviewed
      subject: "{$.pull_request.title}"
      summary: "{$.review.body}"
      link: "{$.review.html_url}"
      occurred_at: "{$.review.submitted_at}"
      correlation_keys: ["{$.repository.full_name}#{$.pull_request.number}"]
      sender: "{$.sender.login}"
    sender_verified: on_signature
  - id: github-pr-review-comments
    match: {header: {X-GitHub-Event: pull_request_review_comment}, json_path: "$.action", equals: created}
    fields:
      id: "{header.X-GitHub-Delivery}"
      type: pr.review_commented
      subject: "{$.pull_request.title}"
      summary: "{$.comment.body}"
      link: "{$.comment.html_url}"
      occurred_at: "{$.comment.created_at}"
      correlation_keys: ["{$.repository.full_name}#{$.pull_request.number}"]
      sender: "{$.sender.login}"
    sender_verified: on_signature
