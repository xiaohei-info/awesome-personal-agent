    how: |-
      WEB 调用 `POST /v1/import?source=acc-imp`，请求体同上，不带任何授权头；随后 `GET /v1/imports`。
    expected: |-
      通过：200，返回 `batch`（imp_ 开头），四行 outcome 与预检一致；GET /imports 最新一条为该批次，来源 acc-imp、actor 为本人、无 grant、条数正确。
      失败：被要求授权单，或结果与预检不一致。
