- id: flow-material-budget
  name: 调用模型时按外发范围和资料预算裁剪并留痕，账本原文不变，建议事项正文不整份复制原文
  actions:
  - id: ACT-BUD-01
    kind: business-action
    step: 生成端点的资料预算缺省 24000 且只在 Web 可改
    how: |-
      WEB 调用 `GET /v1/settings/model-endpoints`；浏览器打开"设置 › 模型"看生成端点一块；在页面把资料预算改为 3000 保存；再用 DEL 调 `PUT /v1/settings/model-endpoints`。
    expected: |-
      通过：未设过时 `generate_endpoint.max_material_chars` 读作 24000，页面显示 24000；保存后读回 3000 并记 policy.changed；DEL 的 PUT 被拒（403）。
      失败：缺省不是 24000、页面无此字段，或非 Web 能改。
    requirement_ids: [REQ-WB-18, REQ-WEB-MODELBUDGET]
  - id: ACT-BUD-02
    kind: business-action
    step: 超预算的长正文按首 3/4 尾 1/4 裁剪送给起草
    how: |-
      保持预算 3000；`$SRC_CASE` 设为 `big-body`（acc-raw 命中内置 mail-received 规则，走初筛与起草），把 CLS_STUB 对该事件的初筛配为 p_yes=0.95；等事件处理完后查看 MODEL_LOG 中 triage-draft 请求的资料正文。
    expected: |-
      通过：资料正文不超过 3000 个字符，开头约 2250 个字符等于原文开头、结尾约 750 个字符等于原文结尾，中间是一行"省略 N 个字符"且 N 等于被省略的字符数。
      失败：超出预算、只截头不留尾，或省略数不对。
    requirement_ids: [REQ-RAW-BUDGET-CUT, REQ-WB-18]
  - id: ACT-BUD-03
    kind: business-action
    step: 聚合消息从最新一条往前整条保留
    how: |-
      先按 flow-extract-align 的 ACT-XAL-01 准备 acc-chat 来源与 extract 规则；把 acc-chat 的 `$SRC_CASE` 设为 `chat-long`（60 条、每条约 100 字符），等处理完后查看 MODEL_LOG 中 triage-extract 请求的资料。
    expected: |-
      通过：送出的是最新的若干条完整消息，没有被切开的消息，并有一行写明省略了更早的几条，条数正确。
      失败：消息被从中间切断，或保留的是最旧的消息。
    requirement_ids: [REQ-RAW-BUDGET-CUT]
  - id: ACT-BUD-04
    kind: business-action
    step: 裁剪量在判断记录、处置载荷与处理经过里可见，原文不变
    how: |-
      对 ACT-BUD-02 的事件：`APA_TOKEN=$OBS apa why <事件生成的建议事项>`；`GET /v1/audit/events` 找该事件的入站处置 Event；浏览器打开该事件的处理经过页 `/sources/events/<id>`；WEB 读 `GET /v1/source-events/<id>?part=body` 的 sha256。
    expected: |-
      通过：判断记录的初筛一级记有送出字符数、裁剪前字符数与方式（判断端点预算 8000）；处置载荷带 `material`（送出、裁剪前字符数与方式）；处理经过页显示"送给模型 N / M 字符"与载荷一致；body 的 sha256 与 SRC_STUB 输出相同。
      失败：任一处缺裁剪量，或原文被改。
    requirement_ids: [REQ-RAW-BUDGET-TRACE, REQ-WB-11]
  - id: ACT-BUD-05
    kind: business-action
    step: 旧处置不显示裁剪量
    how: |-
      在升级后的结构版本 7 夹具副本上打开一条升级前已处置事件的处理经过页，并读其处置 Event 载荷。
    expected: |-
      通过：载荷没有 material，页面不显示"送给模型 N / M 字符"也不报错。
      失败：页面报错或显示伪造的裁剪量。
    requirement_ids: [REQ-WB-11]
  - id: ACT-BUD-06
    kind: business-action
    step: 外发范围先于预算生效
    how: |-
      把生成端点的位置改为 external（Web 设置 › 模型），对 acc-raw-ex 输出一条 big-body 事件；查看 MODEL_LOG 的资料正文；流程结束改回 local。
    expected: |-
      通过：送出的正文不超过 500 个字符（excerpt），不出现"省略 N 个字符"之外的超范围内容。
      失败：外部端点收到超出外发范围的内容。
    requirement_ids: [REQ-RAW-BUDGET-CUT]
  - id: ACT-BUD-07
    kind: business-action
    step: 建议事项正文超过 4000 字符时只写前 4000 并链到原文
    how: |-
      对 ACT-BUD-02 生成的建议事项 `APA_TOKEN=$OBS apa item show <id> --json`；另对一条正文 3000 字符的事件（`$SRC_CASE` 设为 `mid-body`）生成的建议同样查看。
    expected: |-
      通过：长事件的事项 body 是原文前 4000 个字符，末尾注明"原文较长"并带来源原文页链接，`proposal.sources[]` 含该来源事件 id；短事件的 body 是完整原文。
      失败：长正文被整份复制，或短正文被截。
    requirement_ids: [REQ-WB-38]
  - id: ACT-BUD-08
    kind: business-action
    step: 来源对象更新刷新事项正文时同样按 4000 规则
    how: |-
      让 SRC_STUB 对 ACT-BUD-07 的长事件输出一条同关联键的更新版本（正文仍 200 KiB、开头改动），等处理；查看事项 body。
    expected: |-
      通过：事项 body 刷新为新版本的前 4000 个字符并保留"原文较长"与链接。
      失败：刷新时整份复制或不刷新。
    requirement_ids: [REQ-WB-38]
- id: flow-raw-retention
  name: 本人可按来源设原文保留天数，后台按天数清掉不挂未关闭事项的原文，事件行留元信息
  actions:
  - id: ACT-RET-01
    kind: business-action
