    how: |-
      WEB 调用 `PUT /v1/settings/sources/<acc-raw-ex id>/content-retention` 请求体 `{"days": 1}`；用 DEL 调同一路由；再 WEB 以 `{"days": null}` 设 acc-raw-meta。
    expected: |-
      通过：WEB 返回 200，来源登记的 `content_retention_days` 为 1，并记一条 Event；DEL 被拒（403）；null 读回为空（不清理）。
      失败：非 Web 能设，或设置不生效。
    requirement_ids: [REQ-WB-07]
  - id: ACT-RET-02
    kind: business-action
    step: 超过天数且不挂未关闭事项的原文被清，挂在未关闭事项上的保留
    how: |-
      acc-raw-ex 上准备两条事件：E1 无关联事项，E2 已在 Web 接受为事项且事项为 open；先对 E1 在来源原文页取回一个附件（见 flow-attachment-fetch 的做法）；`tc_advance 172800`，等一轮维护循环；WEB 读两条 `GET /v1/source-events/<id>`；`GET /v1/audit/events` 看清除记录。
    expected: |-
      通过：E1 的 `content.state` 为 `purged`，没有 body 与其他部分，事件行仍有类型、标题、发送者、时间、链接与处置；E1 取回的附件已删除；E2 原文完整；本轮对 acc-raw-ex 记一条内部审计事件写明条数与字节数（不逐条记），该事件不出现在 `GET /v1/events`。
      失败：E2 被清、E1 未清、事件行被删，或逐条记审计。
    requirement_ids: [REQ-RAW-RETAIN, REQ-WB-14]
  - id: ACT-RET-03
    kind: business-action
    step: 未设保留天数的来源不清理
    how: |-
      同一时间推进后读 acc-raw 与 acc-raw-meta 的最早事件。
    expected: |-
      通过：两者 state 不是 purged，原文完整。
      失败：默认被清理。
    requirement_ids: [REQ-RAW-RETAIN]
- id: flow-raw-purge
  name: 本人可在 Web 物理删除一条来源事件或连同事项一并删除，删除后同一事件不重新入账
  actions:
  - id: ACT-PRG-01
    kind: business-action
    step: 在来源原文页物理删除一条来源事件
    how: |-
      对 acc-raw 的一条已有判断记录的 mail-like 事件，在浏览器打开 `/sources/events/<id>` 点删除并确认（等价于 WEB `POST /v1/settings/purge` 的 `object` 为该事件 id）；然后 WEB 读 `GET /v1/source-events/<id>`、`apa why` 该事件原先的判断记录。用 DEL 对另一条事件调 `POST /v1/settings/purge`。
    expected: |-
      通过：单条读取 404；原文各部分、无其他引用的取回附件与指向它的判断记录都不在；另记一条删除事件；DEL 调用被拒（403）。
      失败：任一残留，或非 Web 能删。
    requirement_ids: [REQ-RAW-PURGE, REQ-WB-27-PURGE]
  - id: ACT-PRG-02
    kind: business-action
    step: 去重键墓碑阻止同一事件重新入账
    how: |-
      让 SRC_STUB 再次输出 ACT-PRG-01 删除的那条事件（同一事件 id），等一轮；`apa source events acc-raw`。
    expected: |-
      通过：该事件没有重新出现，也不进被拒收的事件。
      失败：被重新入账。
    requirement_ids: [REQ-RAW-PURGE]
  - id: ACT-PRG-03
    kind: business-action
    step: 删除事项时连同它的来源事件
    how: |-
      对一个由 acc-raw 事件生成的事项，WEB 调 `POST /v1/settings/purge`，`object` 为事项 id 且带 `"with_source_events": true`（Web 物理删除事项时勾选"连同它的来源事件"）；再对另一事项不带此键删除。
    expected: |-
      通过：前者的来源事件单条读取 404；后者的来源事件仍在且原文完整。
      失败：勾选不生效，或不勾选也删了来源事件。
