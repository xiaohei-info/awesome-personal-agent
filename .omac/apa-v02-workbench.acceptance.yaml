    expected: |-
      通过：每次真实导入（不含预检）各有一条 `import.completed`，载荷含来源名、新建与已存在条数；订阅里没有任何带 imported 的事件。
      失败：缺 import.completed，或导入事件出现在订阅流。
    requirement_ids: [REQ-WB-10, REQ-IMP-NOAUTO]
- id: flow-import-no-automation
  name: 导入写下的历史事件只进账本与折叠，不触发规则、提醒、跟进、摘要、注入、统计、简报与对外事件流；导入的未完成事项从导入时刻起算
  actions:
  - id: ACT-INA-01
    kind: business-action
    step: 导入前后各订阅方没有新增
    how: |-
      以 flow-import-apply 的 ACT-IMP-01 基线为准，在 ACT-IMP-03 之后立即：sqlite3 只读统计投递表、规则触发与观察记录、Timer、摘要起草运行；`GET /v1/deliveries/today`；`APA_TOKEN=$DEL apa context` 的增量；`GET /v1/events?after=<基线序号>`。
    expected: |-
      通过：投递、规则触发与 rule.observed、摘要起草、注入增量、对外事件流（除 import.completed）都没有因导入新增；Timer 只多出 T-0002 的截止 Timer 与第一轮跟进 Timer。
      失败：任一订阅方因导入事件产生了新行。
    requirement_ids: [REQ-IMP-NOAUTO]
  - id: ACT-INA-02
    kind: business-action
    step: 导入事件在账本、审计与回放里都读得到
    how: |-
      `APA_TOKEN=$OBS apa why <T-0001 事项 id>`；`GET /v1/audit/events?imported=<batch>`；`GET /v1/audit/events` 不带筛选看同一序号段。
    expected: |-
      通过：apa why 回放出完整时间线；带筛选只返回该批次事件且都带 imported 与 recorded_at；不带筛选的审计也包含它们。
      失败：导入事件在审计或回放里缺失。
    requirement_ids: [REQ-IMP-NOAUTO, REQ-WB-09]
  - id: ACT-INA-03
    kind: business-action
    step: 已过期截止照常触发一次，跟进从导入时刻起算
    how: |-
      导入后等一次时钟扫描；`GET /v1/audit/events?type=item.deadline_passed`；再按策略的跟进梯度 `tc_advance <第一轮间隔秒数>`，看 T-0002 的跟进提醒。
    expected: |-
      通过：T-0002 恰好有一条 `item.deadline_passed`（普通事件，不带 imported）；第一轮跟进提醒在导入时刻加第一轮间隔后到达，而不是从 10-11 起算立即到达。
      失败：截止被屏蔽、触发多次，或跟进按原始时刻立刻提醒。
    requirement_ids: [REQ-WB-40]
  - id: ACT-INA-04
    kind: business-action
    step: 未完成的导入事项不立刻进久未推进
    how: |-
      导入后立刻看 Web"今天"视图与 `GET /v1/today` 的久未推进部分；再 `tc_advance` 到久未推进阈值之后看一次。
    expected: |-
      通过：导入后立刻没有 T-0002；阈值以导入时刻起算过后才出现。
      失败：一导入就进久未推进。
    requirement_ids: [REQ-WB-40]
  - id: ACT-INA-05
    kind: business-action
    step: 当天活动与简报取材不计导入事件
    how: |-
      导入后立刻对一个 brief 实例点"立即跑一次"（Web 简报页），用 STUB_HARNESS 读运行目录的资料文件。
    expected: |-
      通过：activity 段没有 T-0001 的进展与完成；导入的事项本身可出现在 planned 等按事项取的段里。
      失败：导入的历史事件进了 activity。
    requirement_ids: [REQ-IMP-NOAUTO, REQ-BRF-WINDOW]
- id: flow-import-grant
  name: Agent 只能凭本人在 Web 签发的导入专用授权单导入，原话不够，来源名与条数受单约束
  actions:
  - id: ACT-IGR-01
    kind: business-action
    step: 导入专用授权单的签发规则
    how: |-
      WEB 依次调用 `POST /v1/settings/grants`：A `actions: ["import.apply"]`、`import: {source: acc-imp3, max_records: 3}`、expires_at 为 6 天后、grantee 为 DEL；B 同 A 但 expires_at 为 8 天后；C 同 A 但不带 import 段；D 同 A 但带 `background: true`；E `actions: ["import.apply", "item.progress"]`；F 同 A 但不带 expires_at。再用 DEL 调一次 A。
    expected: |-
      通过：A 成功；B、C、D、E、F 都返回 400 且 why 指出对应规则；DEL 签发被拒（403），签发只在 Web。
      失败：任一违规单被签发，或非 Web 能签。
    requirement_ids: [REQ-WB-19B]
  - id: ACT-IGR-02
    kind: business-action
    step: 不带单与只带原话都是 23 grant_required
    how: |-
      `APA_TOKEN=$DEL apa import --file $IMP3 --source acc-imp3`（不带 --grant）；`APA_TOKEN=$DEL apa import --file $IMP3 --source acc-imp3 --evidence "我说导入"`；`$IMP3` 为 2 条合法事项。分别在 `APA_SESSION_KIND=direct` 与 `group` 下各执行一次。
    expected: |-
      通过：四次都退出码 23，code 为 `grant_required`；会话类型不改变结果；账本无新增。
      失败：凭原话导入成功，或退出码不是 23。
    requirement_ids: [REQ-WB-20, REQ-WB-28]
  - id: ACT-IGR-03
    kind: business-action
    step: 凭单导入成功，事件带授权单 id
    how: |-
      `APA_TOKEN=$DEL apa import --file $IMP3 --source acc-imp3 --grant <A 的 id>`；`GET /v1/audit/events?imported=<该批次>`。
    expected: |-
      通过：退出码 0，逐行输出 created；每条导入事件带 imported、recorded_at 与 grant（A 的 id）；GET /imports 该批次 grant 为 A。
      失败：缺 grant 或写入失败。
    requirement_ids: [REQ-WB-20, REQ-IMP-AUTH-PATH, REQ-WB-29]
  - id: ACT-IGR-04
    kind: business-action
    step: 来源名不符与累计超上限被拒
    how: |-
      用 A 以来源名 `acc-other` 导入 1 条；再用 A 以 acc-imp3 导入 2 条（已用 2，上限 3）。
    expected: |-
      通过：前者 23，code `import_source_mismatch`；后者 23，code `import_limit_exceeded`，账本无新增。
      失败：任一被放行或原因不对。
    requirement_ids: [REQ-WB-20, REQ-WB-28]
  - id: ACT-IGR-05
    kind: business-action
    step: 预检不占授权单条数
    how: |-
      用 A 以 acc-imp3 `--dry-run` 预检 1 条三次，再真实导入 1 条。
    expected: |-
      通过：三次预检退出码 0 且不写账本；真实导入 1 条成功（累计 3，未超上限）。
      失败：预检占用了条数导致真实导入被拒。
    requirement_ids: [REQ-IMP-DRYRUN, REQ-WB-29]
  - id: ACT-IGR-06
    kind: business-action
    step: 运行凭据不能导入
    how: |-
      用 RUNTOK 调 `POST /v1/import?source=acc-imp3` 带 `X-APA-Grant: <A 的 id>`。
    expected: |-
      通过：403，退出码 4。
      失败：后台运行能导入。
    requirement_ids: [REQ-IMP-AUTH-PATH]
  - id: ACT-IGR-07
    kind: business-action
    step: CLI 按 500 条分批并沿用批次号
    how: |-
      新签一张 acc-imp4、max_records 1200 的导入单；`APA_TOKEN=$DEL apa import --file <1100 条合法事项> --source acc-imp4 --grant <id>`；`GET /v1/imports`。
    expected: |-
      通过：CLI 逐行输出 created；GET /imports 只有一个 acc-imp4 批次且 created 为 1100（CLI 分 3 次请求、同一批次号）。
      失败：产生多个批次或条数不对。
    requirement_ids: [REQ-WB-29]
  - id: ACT-IGR-08
    kind: business-action
    step: item.progress 可列入授权单并凭单记进展
    how: |-
      WEB `POST /v1/settings/grants` 签一张 `actions: ["item.progress"]`、scope 为 acc-home 的单给 DEL；`APA_TOKEN=$DEL apa item progress <acc-home 里本人的事项> --text 进展 --grant <id>`；同一命令对 acc-work 的事项再执行一次。
    expected: |-
      通过：签发成功；acc-home 的进展写入，Event 带 grant 与 on_behalf_of；acc-work 的为 23（不在 scope）。
      失败：item.progress 不能列入授权单，或越出 scope 被放行。
    requirement_ids: [REQ-WB-19]
- id: flow-web-import
