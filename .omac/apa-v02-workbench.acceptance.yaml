- id: flow-import-apply
  name: 本人把带原始时间线的项目与事项导入账本，时间线与输入一致，重放不重复，预检不写账本
  actions:
  - id: ACT-IMP-01
    kind: flow-step
    step: 准备导入计划文件
    how: |-
      负责人：验收执行者。时机：本流程其他动作前。写 `$IMP_PLAN`（JSONL，三行）：
      ① `type: project`，external_id `acc/alpha`，name `Alpha Imp`，status active，created_at 为 2026-03-02T09:00:00+08:00；
      ② `type: project`，external_id `acc/home`，name `  ACC-HOME `（与已有项目 acc-home 只差空白与大小写）；
      ③ `type: item`，external_id `T-0001`，project `acc/alpha`，item 为 kind task、终态 done、deadline null，history 共 9 条：created（phase open，2026-10-01T09:00:00+08:00）、五条 progress（10-02 至 10-06，`on` 为当天，前三条 `precision: day` 时刻 12:00、后两条给精确时刻）、transition to dropped（带 reason，10-07）、transition to open（10-08）、transition to done（10-09T18:00:00+08:00，`precision: day`）；
      ④ `type: item`，external_id `T-0002`，project `acc/home`，kind task，终态 waiting（带 waiting_on），deadline 为当前时刻前一天，history 只有 created（10-10）与 transition to waiting（10-11）。
      导入用来源名 `acc-imp`。导入前用 sqlite3 只读记下 deliveries、Timer、Event 的行数与最大序号，作为 flow-import-no-automation 的基线。
    expected: |-
      通过：文件 4 行，每行是合法 JSON。失败：文件无法解析。
  - id: ACT-IMP-02
    kind: business-action
    step: 预检只报结果、不写账本
    how: |-
      WEB 调用 `POST /v1/import?source=acc-imp&dry_run=1`，`Content-Type: application/x-ndjson`，请求体为 `$IMP_PLAN`；前后各对 ledger.db 做一次只读的行数统计与最大 Event 序号。
    expected: |-
      通过：响应逐行给出 outcome：①③④为 created，②的 object 为已有项目 acc-home 的 id；`created`/`existing`/`invalid` 计数正确，没有 `batch`；前后行数与最大序号完全相同，`GET /v1/imports` 没有新批次。
      失败：预检写了账本、建了批次或计数不对。
    requirement_ids: [REQ-IMP-DRYRUN, REQ-WB-24-IMPORT]
  - id: ACT-IMP-03
    kind: business-action
