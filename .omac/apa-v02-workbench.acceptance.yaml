flows:
- id: flow-wb-env
  name: 工作台迭代的替身验收环境就绪：沿用 v0.2.0 基线环境，另备桩来源、内容替身、增强的 harness 替身、录制样本与结构版本 7 夹具，全程不连真实账号
  actions:
  - id: ACT-WBENV-01
    kind: flow-step
    step: 建立基线环境
    how: |-
      负责人：验收执行者。时机：执行本文任何其他流程前。
      按 `.omac/apa-v02.acceptance.yaml` 的 flow-env-baseline 依次执行 ACT-ENV-01 至 ACT-ENV-10（测试构建 `-tags apa_testclock`、隔离 APA_HOME、`apa serve`、凭据 OBS/WRK/DEL/CHAN、项目 acc-work/acc-open/acc-home、CLS_STUB、MODEL_STUB、STUB_HARNESS、TOOL_STUB_BIN、测试时钟 `tc_advance`）。
      另把 Web 登录的会话 cookie 存为 `$WEB_COOKIE`，下文"WEB 调用"指 `curl -b $WEB_COOKIE $APA_URL/v1/...`。
      在执行者 shell 默认导出 `APA_SESSION_KIND=direct`、`APA_SESSION=acc-session-1`；测非私聊时在命令前覆盖。
    expected: |-
      通过：ACT-ENV-01..10 各自的 expected 全部达成；WEB 调用 `GET /v1/settings/policy` 返回 200；`apa version` 的 `schema.ledger` 为 8、`test_clock` 为 true。
      失败：任一步未达成，本文其余流程不得开始。
  - id: ACT-WBENV-02
    kind: flow-step
    step: 准备桩来源 SRC_STUB 并登记两个来源
    how: |-
      负责人：验收执行者，使用 R10 节点交付的仓库内桩来源脚本（`tests/doubles/` 下）。时机：ACT-WBENV-01 之后。
      SRC_STUB 每次运行读 case 文件 `$SRC_CASE` 并输出标准事件 JSONL；可产出：正文 200 KiB 的事件（`big-body`）、带 headers/attachments（每项带 `ref`）/original（text/html）的事件（`mail-like`）、带 `messages` 的会话事件（`chat-two-things`，含两件事、每条带 sender）、原文总量超过 `max_source_event_mb` 的事件夹在两条正常事件之间（`oversize-mid`）、带 `content: {state: partial, missing: [...]}` 的事件（`partial`）、201 条 messages 的事件（`too-many-msgs`）、60 条各约 100 字符的会话事件（`chat-long`）、正文 3000 字符的事件（`mid-body`），case 可由执行者追加；以 `fetch` 为唯一参数运行时按 stdin 的 `attachment.ref` 回一段固定字节（可配失败与超过 32 MiB），并在接入声明写 `content.attachments: fetch`。
      在 Web 来源页登记两个脚本来源：`acc-raw`（运行 SRC_STUB，source_type 为 `mail`，外发范围 local=full、external=full，周期 1 分钟）与 `acc-raw-nofetch`（同一脚本但接入声明不写 content 段）。
    expected: |-
      通过：把 `$SRC_CASE` 设为 `mail-like` 后 2 分钟内 `APA_TOKEN=$OBS apa source events acc-raw` 列出该事件；对同一事件 id 手工运行 `echo '<stdin JSON>' | SRC_STUB fetch` 输出固定字节且退出码 0。
      失败：来源不运行、事件不出现或 fetch 模式不可用；依赖 SRC_STUB 的流程不得开始。
  - id: ACT-WBENV-03
    kind: flow-step
    step: 准备结构版本 7 夹具与旧二进制
    how: |-
      负责人：验收执行者，使用 S0 节点交付的夹具。时机：执行 flow-wb-schema8-upgrade 前。
      运行 `go run ./tests/fixtures/ledger/cmd/gen -version 7 -out $FX7` 得到结构版本 7 夹具，导出 `LEDGER_FIXTURE_V7=$FX7`；导出 `APA_V7_BIN`（结构版本 7 冻结提交构建的主程序，`tests/fixtures/ledger/fetch-v01.sh <目录> <冻结提交>`）。
      夹具 `manifest.json` 必须含：各表行数（含来源事件、Event、事项、材料）、event_max_seq、event_payload_sha256、16 KiB 邮件事件的 id 与正文哈希、托管型与自有型材料 id、带授权单（grant）的 Event 序号。
    expected: |-
      通过：`APA_HOME=<夹具副本> $APA_V7_BIN serve` 能打开副本；manifest.json 含上述全部键；正文恰好 16 KiB（16384 字节）的邮件事件至少 3 条。
      失败：夹具缺任一类数据或键，或旧二进制打不开。
  - id: ACT-WBENV-04
    kind: flow-step
    step: 配置模型替身的工作台用例
    how: |-
      负责人：验收执行者。时机：执行 flow-material-budget、flow-extract-align、flow-urgent-notify 前。
      在 `$MODEL_CASES` 为 `triage-extract` 配三种脚本：`two-refs`（两条候选，各带 project、refs、一条带 attach_to 指向清单内事项）、`bad-target`（attach_to 为不存在的事项 id、project 为不存在的项目）、`legacy3`（候选只有 title/kind/summary）；为 `triage-draft` 配 `urgent-true`、`urgent-false`、`urgent-missing` 三种输出。确认 MODEL_LOG 记录完整请求体（含 open_items 清单与资料正文）。
    expected: |-
      通过：用 curl 对 MODEL_STUB 发一条 triage-extract 请求，按匹配键分别得到三种脚本输出；MODEL_LOG 有请求体。
      失败：无法按匹配键返回脚本输出。
- id: flow-wb-schema8-upgrade
  name: 结构版本 7 的账本升级到 8 不丢数据、旧数据照常可读，旧二进制拒绝打开升级后的账本，用快照能回到升级前
  actions:
  - id: ACT-S8-01
    kind: business-action
    step: 用主干二进制打开结构版本 7 夹具副本完成升级
    how: |-
      `cp -R $LEDGER_FIXTURE_V7 $FX_HOME`；`APA_HOME=$FX_HOME apa serve`；随后 `APA_HOME=$FX_HOME apa version` 与 `ls $FX_HOME/backups/`。
    expected: |-
      通过：服务启动成功；`apa version` 的 `schema.ledger` 为 8；`backups/` 下新增一份升级前自动快照且 `apa backup verify <快照>` 退出码 0。
      失败：启动失败、版本不是 8，或没有快照。
    requirement_ids: [REQ-WB-08]
  - id: ACT-S8-02
    kind: business-action
    step: 核对升级后行数、Event 序号与载荷
    how: |-
      服务停止后用 `sqlite3 $FX_HOME/ledger.db` 只读统计各表行数与最大 Event 序号，并按 manifest.json 的 payload_hash_method 重算已有 Event 载荷哈希，与 manifest 比对。
    expected: |-
      通过：每张表行数 ≥ manifest 值；Event 序号从 1 连续到 event_max_seq 且无空洞；已有 Event 载荷哈希与 manifest 逐条相同；新加的 Event 两列（导入批次、实际写入时刻）在已有行上为空。
      失败：任一表行数减少、序号不连续或任一载荷哈希不同。
    requirement_ids: [REQ-WB-UPG-ROWS, REQ-WB-03]
  - id: ACT-S8-03
    kind: business-action
    step: 升级前的 16 KiB 邮件事件照常可读并标为升级前落盘
    how: |-
      对 manifest 里的一条 16 KiB 邮件事件：WEB 调用 `GET /v1/source-events/<id>`；再 WEB 调用 `GET /v1/storage`。
    expected: |-
      通过：响应 `content.state` 为 `legacy`，`body` 的 sha256 与 manifest 中该事件正文哈希相同（读的是原列）；`GET /storage` 该来源的 `content_bytes` 按原列长度计入（不为 0）。
      失败：读不到正文、state 不是 legacy，或正文与升级前不同。
    requirement_ids: [REQ-RAW-LEGACY, REQ-WB-01, REQ-WB-02]
  - id: ACT-S8-04
    kind: business-action
    step: 升级前的材料形态按原规则推定
    how: |-
      `APA_TOKEN=$OBS` 调用 `GET /v1/materials/<托管型 id>` 与 `GET /v1/materials/<自有型 id>`（id 取自 manifest）。
    expected: |-
      通过：前者 `form` 为 `hosted`、后者为 `owned`；sqlite3 只读查看材料表这两行的形态列仍为空（未改写）。
      失败：form 错误或已有行被改写。
    requirement_ids: [REQ-WB-06, REQ-WB-UPG-ROWS]
  - id: ACT-S8-05
    kind: business-action
    step: 已有来源、事项与授权单事件不受新列影响
    how: |-
      `APA_TOKEN=$OBS apa source list --json` 看各来源的 `content_retention_days`；`GET /v1/items?origin_source=import:any` 与 `GET /v1/audit/events?imported=imp_none`；`apa why <manifest 中带 grant 的事件对象>`。
    expected: |-
      通过：所有已有来源的 `content_retention_days` 为空（不清理）；两个查询都返回空列表；带授权单的事件回放仍显示原授权单 id。
      失败：已有来源被设了保留天数、旧事项出现导入信息，或授权单事件回放失败。
    requirement_ids: [REQ-WB-07, REQ-WB-04, REQ-WB-05, REQ-WB-UPG-ROWS]
  - id: ACT-S8-06
    kind: business-action
    step: 旧二进制拒绝打开升级后的账本，快照恢复后与升级前一致
    how: |-
      停服务；`APA_HOME=$FX_HOME $APA_V7_BIN serve`；再把 ACT-S8-01 的快照按 §16.5 恢复到新目录 `$FX_RESTORE` 并 `APA_HOME=$FX_RESTORE $APA_V7_BIN serve`，用 sqlite3 统计行数与最大 Event 序号。
    expected: |-
      通过：第一次启动失败并报账本结构版本比程序新（退出码非 0，账本文件哈希不变）；恢复后用旧二进制能启动，各表行数与 event_max_seq 与 manifest 完全一致。
      失败：旧二进制能打开升级后的账本，或恢复结果与升级前不一致。
    requirement_ids: [REQ-WB-08]
  - id: ACT-S8-07
    kind: business-action
    step: 迁移链与失败回滚测试通过
    how: |-
      运行 `go test -tags apa_testclock ./tests/fixtures/... ./kernel/store/...`，并在一份新的结构版本 7 副本上以 `APA_TEST_MIGRATION_FAIL_AFTER=1 apa serve` 启动一次。
    expected: |-
      通过：测试全部通过且包含 7→8 的升级用例与每个已冻结版本到主干的用例；注入失败时启动报错，副本的 ledger.db 哈希与注入前相同、结构版本仍为 7。
      失败：缺 7→8 用例、任一冻结版本升级失败，或注入失败后账本被部分改动。
    requirement_ids: [REQ-WB-UPG-CHAIN]
- id: flow-raw-full-ingest
  name: 来源事件的完整原文按部分入账，单条读取逐字节读回，事件列表只带预览与清单
  actions:
  - id: ACT-RAW-01
    kind: business-action
    step: 200 KiB 正文的事件完整入账并逐字节读回
    how: |-
      `$SRC_CASE` 设为 `big-body`，等一轮拉取；记下 SRC_STUB 输出正文的 sha256；WEB 调用 `GET /v1/source-events/<id>?part=body` 与 `GET /v1/source-events/<id>`。
    expected: |-
      通过：body 长度为 204800 字节且 sha256 与 SRC_STUB 输出相同；`content.state` 为 `full`，`content.parts` 有 body 项（media_type、bytes=204800、sha256）；`scope` 为 `full`。
      失败：正文被截断、哈希不同，或清单缺字段。
    requirement_ids: [REQ-RAW-FULL, REQ-WB-01, REQ-WB-24-SRCEVT]
  - id: ACT-RAW-02
    kind: business-action
    step: 头部、附件清单、原始正文与逐条消息各自成部分
    how: |-
      `$SRC_CASE` 依次设为 `mail-like` 与 `chat-two-things`，各等一轮；WEB 调用 `GET /v1/source-events/<id>` 与 `?part=headers|attachments|original|messages`。
    expected: |-
      通过：mail-like 的 `headers` 与输出一致（同名多值为数组）、`attachments` 每项有 name/media_type/size/ref 且无 blob、`original` 为 `{media_type: text/html, text}` 原样；chat-two-things 的 `messages` 每条 sender/text/at 与输出一致不截断；各部分在 `content.parts` 里有 bytes 与 sha256。
      失败：任一部分缺失、被改写或截断。
    requirement_ids: [REQ-RAW-FULL, REQ-WB-35]
  - id: ACT-RAW-03
    kind: business-action
    step: partial 自报被如实记录
    how: |-
      `$SRC_CASE` 设为 `partial`（missing 为 original 与 attachments，各带原因），等一轮；WEB 调用 `GET /v1/source-events/<id>`。
    expected: |-
      通过：`content.state` 为 `partial`，`content.missing` 逐项列出 part 与 reason，与输出一致；其余部分照常保存。
      失败：state 记成 full，或 missing 丢失。
    requirement_ids: [REQ-RAW-PARTIAL]
  - id: ACT-RAW-04
    kind: business-action
    step: 事件列表与挂靠消息列表只带 2000 字符预览与原文清单
    how: |-
      `APA_TOKEN=$OBS` 调用 `GET /v1/sources/<acc-raw id>/events`；把 big-body 事件经 Web 建议流接受成事项后，再让 SRC_STUB 输出一条同关联键的 big-body 回信使其挂靠，调用 `GET /v1/items/<事项 id>/messages`。
    expected: |-
      通过：两个列表里该事件的 `detail` 不超过 2000 个字符且是正文开头，另带 `content`（各部分字节数、总字节数、state，不含内容）；列表不返回 messages 内容；用单条读取能拿到全文。
      失败：列表带全文、缺 content，或预览不是正文开头。
    requirement_ids: [REQ-WB-25]
  - id: ACT-RAW-05
    kind: business-action
    step: CLI 读单条来源事件
    how: |-
      `APA_TOKEN=$OBS apa source event <big-body 事件 id>` 与 `APA_TOKEN=$OBS apa source event <mail-like 事件 id> --part headers`。
    expected: |-
      通过：前者输出事件、原文清单与正文并写明所用范围（acc-raw 的 external 为 full 时为 full）与裁剪量；后者只输出 headers；退出码 0。
      失败：命令不存在、输出缺范围说明，或 --part 输出了其他部分。
    requirement_ids: [REQ-WB-29]
  - id: ACT-RAW-06
    kind: business-action
    step: 任何入口都不能改写来源原文
    how: |-
      对 ACT-RAW-04 接受的事项用 `APA_TOKEN=$WRK apa item update <事项> --body "改过的正文"`（或 Web 编辑正文）；再 WEB 调用 `GET /v1/source-events/<big-body id>?part=body`；检查附录 B.2 没有任何写来源原文的路由。
    expected: |-
      通过：事项正文变了，来源事件 body 的 sha256 与 ACT-RAW-01 相同；不存在可写来源原文的命令或路由。
      失败：改事项正文影响了原文，或存在改写原文的入口。
    requirement_ids: [REQ-RAW-NOWRITE]
- id: flow-raw-limits
  name: 超过单条上限的事件整条拒收并留痕，同批其余事件照常落盘；内核不截取一段入账
  actions:
  - id: ACT-RLIM-01
    kind: flow-step
    step: 调低单条上限便于验证
    how: |-
      在运行配置里把 `max_source_event_mb` 设为 1 并重启 `apa serve`（§16.2）。本流程结束时改回缺省 16 并重启。
    expected: |-
      通过：重启后 `apa doctor --json` 无配置错误。失败：配置不被接受。
  - id: ACT-RLIM-02
    kind: business-action
    step: 超限事件被拒收，前后两条照常入账，游标推进
    how: |-
      `$SRC_CASE` 设为 `oversize-mid`（第 2 条原文合计约 1.5 MiB，第 1、3 条正常），等一轮；`APA_TOKEN=$OBS apa source rejects acc-raw`；`APA_TOKEN=$OBS apa source events acc-raw`；`apa source list --json` 看 acc-raw 的游标。
    expected: |-
      通过：被拒收的事件里有该行，原因 `event_too_large` 并带实际字节数；第 1、3 条都在事件列表且 state 为 full；游标推进到第 3 条之后；账本里不存在第 2 条的任何截取片段。
      失败：整批失败、截取一段入账、原因不是 event_too_large，或游标没推进。
    requirement_ids: [REQ-WB-15, REQ-WB-28]
  - id: ACT-RLIM-03
    kind: business-action
    step: 聚合消息超过 200 条的事件整行拒收
    how: |-
      `$SRC_CASE` 设为 `too-many-msgs`，等一轮；`APA_TOKEN=$OBS apa source rejects acc-raw`。
    expected: |-
      通过：该行进被拒收的事件并写明原因；同批其余行照常。
      失败：该行入账或只存了前 200 条。
    requirement_ids: [REQ-RAW-MSGCAP]
  - id: ACT-RLIM-04
    kind: business-action
    step: 一次拉取的 stdout 超过 max_source_output_mb 时的处置
    how: |-
      把 `max_source_output_mb` 临时设为 1 并重启；让 SRC_STUB 一次输出 10 条各 200 KiB 的事件；看事件列表、游标与来源页的最近失败；结束后改回缺省并重启。
    expected: |-
      通过：上限内已解析的事件落盘，末尾半行丢弃，游标不动，本次记为临时失败且原因写明超限。
      失败：一条都不落盘、游标被推进，或半行被入账。
    requirement_ids: [REQ-RAW-MSGCAP]
- id: flow-raw-webhook
  name: 只用字段映射的 webhook 来源把请求体作为原文永久保存，请求体上限可配
  actions:
  - id: ACT-WHK-01
    kind: business-action
    step: 字段映射 webhook 的请求体进原文 original
    how: |-
      在 Web 来源页登记一个只用字段映射（映射不写 detail）的 webhook 来源 `acc-hook`；用其接收密钥向 `/ingest/<acc-hook>` POST 一段 JSON；WEB 调用 `GET /v1/source-events/<转换出的事件 id>?part=original`；`tc_advance 2678400`（31 天）后再读一次。
    expected: |-
      通过：`original.text` 与请求体逐字节相同，media_type 为 application/json；31 天后 Ingest 请求体按 30 天被清掉，但来源事件的 original 仍在。
      失败：original 缺失，或随 Ingest 一起被清。
    requirement_ids: [REQ-WB-41]
  - id: ACT-WHK-02
    kind: business-action
    step: max_webhook_body_mb 缺省 1 且可改
    how: |-
      不改配置时 POST 一个 1.2 MiB 的请求体；再把 `max_webhook_body_mb` 设为 2 并重启，重发同一请求；结束后删掉该配置项并重启。
    expected: |-
      通过：缺省时返回 413 且不落盘（来源事件与 Ingest 都没有新行）；设为 2 后同一请求被接收并转换。
      失败：缺省值不是 1 MiB，或配置不生效。
    requirement_ids: [REQ-WB-16]
- id: flow-raw-read-scope
  name: 本人在 Web 读到全文，token 读到的原文不超过该来源对外部端点的外发范围，运行凭据与 ext 密钥读不到
  actions:
  - id: ACT-RSC-01
    kind: flow-step
    step: 准备四种外发范围的来源与读取凭据
    how: |-
      负责人：验收执行者。时机：本流程其他动作前。在 Web 来源页再登记三个运行 SRC_STUB 的来源：`acc-raw-ex`（external=excerpt）、`acc-raw-meta`（external=meta）、`acc-raw-none`（external=none），local 都为 full；把三者与 acc-raw 的 `$SRC_CASE` 都设为 `mail-like` 并等一轮。
      取运行凭据 RUNTOK：在 Web 对 acc-home 的一件事项发起一次 acc-stub 后台运行，从运行目录的环境变量记录里取 `APA_TOKEN`（运行期间有效）。ext 密钥用基线的 CHAN。
      外部范围未选择的来源取 flow-wb-schema8-upgrade 升级后夹具副本里任一 v0.1 登记的来源（manifest 标明其 outbound.external 未选择），在该副本实例上执行 ACT-RSC-04 的未选择部分。
    expected: |-
      通过：四个来源各有一条 mail-like 事件；RUNTOK 能调 `GET /v1/today`。失败：任一来源无事件或 RUNTOK 无效。
  - id: ACT-RSC-02
    kind: business-action
    step: Web 登录读到全文
    how: |-
      WEB 调用 `GET /v1/source-events/<acc-raw-none 的事件 id>`。
    expected: |-
      通过：`scope` 为 `full`，返回 body 全文、original、headers、attachments；无 trimmed。
      失败：Web 登录被按外发范围裁剪。
    requirement_ids: [REQ-WB-24-SRCEVT, REQ-WB-26]
  - id: ACT-RSC-03
    kind: business-action
    step: token 按 excerpt 范围读到摘录
    how: |-
      `curl -H "Authorization: Bearer $OBS" $APA_URL/v1/source-events/<acc-raw-ex 的事件 id>`；对 acc-raw 的事件同样读一次。
    expected: |-
      通过：acc-raw-ex 的 `scope` 为 `excerpt`，只回摘要与正文前 500 个字符，不回 original、headers、messages，`trimmed` 写明 total_chars 与 returned_chars；acc-raw 的 `scope` 为 `full` 并回全部部分。
      失败：excerpt 时返回超过 500 字符的正文或任一被排除的部分。
    requirement_ids: [REQ-WB-26]
  - id: ACT-RSC-04
    kind: business-action
    step: token 在 meta、none 与未选择时只读到元信息
    how: |-
      用 OBS 分别读 acc-raw-meta、acc-raw-none 的事件；在夹具副本实例上用夹具的 observer token 读未选择外部范围的来源的一条事件。
    expected: |-
      通过：三者都只回 `event` 的元信息与 `content` 清单，没有 body、original、headers、attachments、messages；scope 为 `meta`。
      失败：任一返回正文或部分内容。
    requirement_ids: [REQ-WB-26]
  - id: ACT-RSC-05
    kind: business-action
    step: 运行凭据与 ext 密钥不能读来源原文
    how: |-
      用 RUNTOK 与 CHAN 各调用一次 `GET /v1/source-events/<acc-raw 的事件 id>`；`APA_TOKEN=$RUNTOK apa source event <id>`。
    expected: |-
      通过：两次 HTTP 都是 403；CLI 退出码 4。
      失败：任一返回 200。
    requirement_ids: [REQ-WB-26, REQ-WB-24-SRCEVT]
  - id: ACT-RSC-06
    kind: business-action
    step: 已接受事项上的挂靠消息按挂靠消息权限读，不按外发范围裁剪
    how: |-
      把 acc-raw-none 的那条事件在 Web 建议流接受为事项，再让 SRC_STUB 对 acc-raw-none 输出一条同关联键的回信使其挂靠；用 OBS 调 `GET /v1/source-events/<回信事件 id>`。
    expected: |-
      通过：回信按 `GET /items/{id}/messages` 的权限返回正文全文（不因 none 被裁成元信息）。
      失败：被按外发范围裁剪，或 OBS 无权读。
    requirement_ids: [REQ-WB-26]
  - id: ACT-RSC-07
    kind: business-action
    step: 对话捕获的内部来源原文只对 Web 登录开放
    how: |-
      用 STUB_HARNESS 提交一段对话增量产生一条对话捕获事件；用 OBS 与 WEB 各读一次 `GET /v1/source-events/<该事件 id>`。
    expected: |-
      通过：WEB 返回全文；OBS 返回 403。
      失败：token 读到对话捕获原文。
    requirement_ids: [REQ-RAW-CAPTURE]
- id: flow-storage
