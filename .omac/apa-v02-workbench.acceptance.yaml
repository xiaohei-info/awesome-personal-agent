      打开 ACT-RPL-01 的父事项与 ACT-LNK-05 的事项详情页。
    expected: |-
      通过：材料区按依据、产出、纪要分组；链接型带"打开"；来源区的来源事件链到 `/sources/events/<id>`。
      失败：不分组或缺"打开"。
    requirement_ids: [REQ-WEB-MATERIALS, REQ-WEB-RAWLINKS]
- id: flow-prefill-new
  name: 外部工具里的一个链接打开预填好的新建页，本人点新建才写入，未登录先登录
  actions:
  - id: ACT-PRE-01
    kind: business-action
    step: 未登录时先到登录页再回到预填表单
    how: |-
      在一个未登录的浏览器打开 `$APA_URL/new?title=买票&body=第一行&project=acc-work&planned_for=2026-12-01&deadline=2026-12-03&link=vault:acc-vault/行程.md`，登录。
    expected: |-
      通过：先到登录页，登录后回到新建表单，各字段已填，页头标明"内容由链接预填"；此时账本事项数不变（sqlite3 只读统计前后一致）。
      失败：未登录直接写入、登录后丢失参数，或打开即写入。
    requirement_ids: [REQ-WEB-PREFILL]
  - id: ACT-PRE-02
    kind: business-action
    step: 点新建后写入并登记依据材料
    how: |-
      在 ACT-PRE-01 的表单点"新建"；查看新事项详情与 `GET /v1/materials`。
    expected: |-
      通过：事项创建，planned_for 与 deadline 正确；`vault:acc-vault/行程.md` 被登记为 acc-work 的链接型材料并以 basis 关联到新事项。
      失败：材料未登记或关系错误。
    requirement_ids: [REQ-WEB-PREFILL]
  - id: ACT-PRE-03
    kind: business-action
    step: 不合法或无项目的 link 写进正文，超长部分丢弃，项目认不出留空
    how: |-
      已登录打开 `/items/new?title=<250 个字符>&body=<4500 个字符>&project=不存在的项目&link=file:///tmp/a.md` 并新建；再打开 `/new?project=<acc-home 的 id>&link=https://example.invalid/x` 但不选项目以外的改动直接新建。
    expected: |-
      通过：第一份标题只保留前 200 个字符、正文前 4000 个字符并有提示，项目为空，link 作为一行写在正文末尾、不登记材料；第二份按 id 认出 acc-home 并把网址登记为依据材料。
      失败：超长被保留、非法位置被登记，或项目认不出时报错。
    requirement_ids: [REQ-WEB-PREFILL]
- id: flow-brief-material
  name: 简报的资料文件按实例窗口带上日程、新增建议、待决策、到期与等待、当天活动与来源原文，早晚两个实例互不影响
  actions:
  - id: ACT-BRF-01
    kind: flow-step
    step: 准备简报夹具状态与两个实例
    how: |-
      负责人：验收执行者，或直接使用 B3 节点交付的固定账本夹具。时机：本流程其他动作前。在实例上造出：
      两个日历来源（`calendar` 与 `apple-pim-source` config.kind=calendar，TOOL_STUB_BIN 回放）：三天内的日程 C1、C2，其中 C1 有一条改期后的新版本，另有一条最新版本为取消的 C3，还有一条在第 5 天的 C4；
      建议流里 3 条未处置建议（一条把握低、各带推荐与理由）；2 条 needs_input 事项（一条为 web_only 且初筛未返回）；今天与明天到期、已过期、刚从 waiting 回 open、跟进已到期仍在等、久未推进的事项各一；
      今天完成的事项与写下的进展各若干；一批导入的历史事件（flow-import-apply 已有）；
      用户能力包 acc-wb 里一条 `then: digest` 规则作用于 source_type `digest-src`，并在三个 SRC_STUB 来源 `acc-dg-full`、`acc-dg-ex`、`acc-dg-none`（external 分别 full、excerpt、none，source_type digest-src）各产出两条正文 30000 字符的知会事件；
      建两个 brief 实例：`brief-am`（instruction 写"只写日程与待决策"）与 `brief-pm`（不写 instruction，schedule_days 为 3），运行者为 STUB_HARNESS（读资料文件、把各段原样写回 sections[].body，每节带 title）。
    expected: |-
      通过：`apa item list --kind brief` 为空；建议流 3 条；`GET /v1/today` 可见上述到期与等待事项。失败：任一条状态没造出来。
  - id: ACT-BRF-02
    kind: business-action
    step: 资料文件各段与账本一致
    how: |-
      在 Web 简报页对 brief-pm 点"立即跑一次"；运行结束后读 STUB_HARNESS 保存的运行目录资料文件。
    expected: |-
      通过：schedule 有 C1（只取改期后的最新版）、C2，没有 C3（已取消）与 C4（超出 3 天），每条带标题、起止、地点与来源名；proposals 为 3 条且 pending_total 为 3，每条带推荐、理由与把握低标记；decisions 只有非 web_only 那条；due_waiting 含今天与明天到期、已过期、回 open、跟进到期、久未推进各条；activity 按项目分组且没有导入事件；所有空段为空数组。
      失败：任一段条目与夹具不一致。
    requirement_ids: [REQ-BRF-SEGMENTS, REQ-BRF-SCHEDULE]
  - id: ACT-BRF-03
    kind: business-action
    step: 没有日历来源时日程为空，schedule_days 生效
    how: |-
      停用两个日历来源后再跑一次 brief-pm；把 brief-pm 的 schedule_days 改为 7 后恢复日历来源再跑；尝试把 schedule_days 设为 15。
    expected: |-
      通过：停用后 schedule 为空数组且不报错；7 天时 C4 出现；15 被加载校验拒绝。
      失败：报错、窗口不变或 15 被接受。
    requirement_ids: [REQ-BRF-SCHEDULE, REQ-WB-33]
  - id: ACT-BRF-04
    kind: business-action
    step: 两个实例各有自己的窗口与内容要求，知会只进先跑的一份
    how: |-
      在 Web 依次对 brief-am、brief-pm 点"立即跑一次"；读两个 brief 事项的 `spec.since`、`spec.until`、`origin` 与两次运行的资料文件；brief-am 的 instruction 文件内容。
    expected: |-
      通过：brief-am 是该实例第一份，窗口为 24 小时；brief-pm 的 since 等于它上一份的 until；两个事项的 origin 各记所属实例；acc-dg-* 的知会只出现在 brief-am 的资料里；brief-am 的 instruction 文件是本人写的要求，brief-pm 的是更新后的 default_instruction。
      失败：两个实例共用窗口，或同一知会进了两份。
    requirement_ids: [REQ-BRF-WINDOW, REQ-WB-33]
  - id: ACT-BRF-05
    kind: business-action
    step: 来源原文文件按外发范围与字符预算
    how: |-
      查看 brief-am 运行目录里 digest 与 proposals 条目给出的原文文件名与文件内容。
    expected: |-
      通过：acc-dg-full 的两条各有一个文件，内容是原文、不超过 20000 个字符且文件头写明裁剪量，条目的 material 记同样的数；acc-dg-ex 的是摘录（正文前 500 个字符）；acc-dg-none 没有原文文件；文件只读；全部文件合计不超过 400000 个字符。
      失败：超出外发范围或预算，或 none 来源有原文文件。
    requirement_ids: [REQ-BRF-RAW]
  - id: ACT-BRF-06
    kind: business-action
    step: 合计超过 400000 字符时从最旧的条目起只留摘要
    how: |-
      让 acc-dg-full 再产出 25 条各 30000 字符的知会，新建一个 brief 实例 brief-big 并跑一次。
    expected: |-
      通过：原文文件合计不超过 400000 个字符；被跳过的是最旧的条目，这些条目只留摘要且 material 写明裁剪。
      失败：超出合计上限，或跳过的是最新的条目。
    requirement_ids: [REQ-BRF-RAW]
  - id: ACT-BRF-07
    kind: business-action
    step: 结果字段与简报页显示带标题的节
    how: |-
      查看 brief-pm 事项的 `spec` 与 Web 简报页；让 STUB_HARNESS 对新的一份只写 period、不写 sections 后退出；打开结构版本 7 夹具副本里一份按 project 分组的旧简报。
    expected: |-
      通过：sections 每节有 title（无 project）时运行代转 done，简报页按节标题显示；只写 period 时转 needs_input 并写明缺 `sections[].body`；旧简报原样可读。
      失败：没有 project 的节被丢弃或判为没写全，或旧简报显示异常。
    requirement_ids: [REQ-WEB-BRIEF, REQ-WB-33]
  - id: ACT-BRF-08
    kind: business-action
    step: 运行凭据仍不能经 API 读来源事件
    how: |-
      在 brief-pm 的运行中，让 STUB_HARNESS 用自己的运行凭据调 `GET /v1/source-events/<acc-dg-full 的事件 id>`。
    expected: |-
      通过：403；简报只能经资料文件拿到原文。
      失败：运行凭据读到原文。
    requirement_ids: [REQ-WB-26, REQ-BRF-RAW]
- id: flow-extract-align
  name: 按会话聚合的消息里的多件事被抽成各自的建议，能对上已有事项的推荐补到，同一件事不重复成建议
  actions:
  - id: ACT-XAL-01
    kind: flow-step
    step: 准备会话来源与用户能力包规则
    how: |-
      负责人：验收执行者。时机：本流程其他动作前。在 `<APA_HOME>/packs/acc-wb/` 放用户能力包（附录 C.5 来源规则）：规则 `chat-extract`（source_type `chat`，`then: extract`）、`chat-np`（source_type `chat-np`，`then: extract`，`prescreen: none`）；重启 `apa serve`。在 Web 登记 SRC_STUB 来源 `acc-chat`（source_type chat）与 `acc-chat-np`（source_type chat-np），外发范围 local=full、external=full。在 acc-work 建一件 open 事项 X1（标题"发布 v2 文档"），供清单命中。CLS_STUB 对 capture-prescreen 配 p_yes=0.95。
    expected: |-
      通过：`apa doctor --json` 显示 acc-wb 包已加载无拒绝；两来源各能跑一轮。失败：包被拒绝或来源不运行。
  - id: ACT-XAL-02
    kind: business-action
    step: 一条含两件事的事件抽出两条候选并各归项目
    how: |-
      MODEL_STUB 对 triage-extract 用 `two-refs`（候选 A 的 project 为 acc-work、refs [0,1]，attach_to 为 X1；候选 B 的 project 为 acc-home、refs [2]）；acc-chat 的 `$SRC_CASE` 设为 `chat-two-things`；等处理完；`apa source events acc-chat --json` 与 `apa item show <每条建议> --json`。
    expected: |-
      通过：事件 disposition 为 proposed，`items[]` 两条、`item` 为第一条；A 在 acc-work 并推荐补到 X1，B 在 acc-home；A 的事项正文是 messages[0]、[1] 两条消息，B 的是 messages[2]。
      失败：只有一条建议、项目丢失，或正文不是 refs 指到的消息。
    requirement_ids: [REQ-X-REFS, REQ-WB-32]
  - id: ACT-XAL-03
    kind: business-action
    step: 三步共用同一份清单，且清单有界、按外发范围过滤
    how: |-
      查看 ACT-XAL-02 的 MODEL_LOG 与 CLS_LOG：capture-prescreen 与 triage-extract 的结构化输入；再在 acc-work 造 130 件 open 事项并把一件来自 acc-raw-none 的事项设为 open，生成端点位置改为 external 后再跑一次 chat-two-things，看请求；结束后改回 local。
    expected: |-
      通过：预筛资料正文后附"未关闭事项"一节，抽取的 open_items 与之是同一份并带活动项目清单；事项多时至多 100 条且写明总数，X1 排在前面；端点为 external 时清单里没有出自 acc-raw-none 的事项。
      失败：预筛不带清单、超过 100 条，或外发范围为 none 的事项进了外部端点的清单。
    requirement_ids: [REQ-X-LIST]
  - id: ACT-XAL-04
    kind: business-action
    step: 清单外的目标与项目被丢弃，候选保留
    how: |-
      MODEL_STUB 改用 `bad-target`；对 acc-chat 输出一条新的会话事件；等处理完。
    expected: |-
      通过：候选照常成为建议；推荐补到作废（建议没有 attach 推荐）；项目为空；不报错，处理经过里没有错误。
      失败：建议被丢弃、报错，或采纳了清单外的目标。
    requirement_ids: [REQ-X-CHOICE]
  - id: ACT-XAL-05
    kind: business-action
    step: 同一件事第二次抽出时并入已有建议
    how: |-
      不处置 ACT-XAL-02 的建议，`tc_advance 86400`；对 acc-chat 再输出一条事件，消息内容与发送者重复 A 那件事；MODEL_STUB 返回与 A 同标题的候选；等处理完。
    expected: |-
      通过：没有新增建议，A 的 proposal.sources[] 多了这条事件，事件的 item 指向 A。
      失败：同一件事成了两条建议。
    requirement_ids: [REQ-WB-39]
  - id: ACT-XAL-06
    kind: business-action
    step: prescreen none 跳过预筛且不产生预筛判断记录
    how: |-
      清空 CLS_LOG；acc-chat-np 输出 chat-two-things；等处理完；`apa why <生成的建议>`。
    expected: |-
      通过：CLS_LOG 与 MODEL_LOG 都没有 capture-prescreen 请求；判断记录里没有预筛一级；抽取照常产出建议。对一段对话增量（STUB_HARNESS 提交）仍有预筛请求。
      失败：仍预筛，或对话候选捕获跳过了预筛。
    requirement_ids: [REQ-X-PRESCREEN-NONE]
  - id: ACT-XAL-07
    kind: business-action
    step: 旧的三字段输出仍被接受
    how: |-
      MODEL_STUB 改用 `legacy3`；acc-chat 输出一条会话事件。
    expected: |-
      通过：候选成为建议，标题、类别、摘要正确，没有推荐与 urgent，不报错。
      失败：旧输出被判为不符合 schema。
    requirement_ids: [REQ-WB-32]
  - id: ACT-XAL-08
    kind: business-action
    step: 一条事件至多取 20 条候选
    how: |-
      MODEL_STUB 返回 25 条候选；acc-chat 输出一条会话事件。
    expected: |-
      通过：只产生 20 条建议。
      失败：超过 20 条。
    requirement_ids: [REQ-WB-39]
  - id: ACT-XAL-09
    kind: business-action
    step: 能力包加载拒绝误用
    how: |-
      依次在 acc-wb 里：加一个名为 `none` 的提示词模板；给一条 `then: screen` 规则写 `prescreen: none`；给一条 `then: proposed` 规则写 `notify_urgent: true`；每次重启后 `apa doctor --json`，验完撤销。
    expected: |-
      通过：三次 acc-wb 都被整包拒绝且原因指出对应字段，同名内置包照常生效。
      失败：任一误用被加载。
    requirement_ids: [REQ-WB-31]
- id: flow-urgent-notify
  name: 本人开启紧急提醒的规则后，当天必须处理的新建议即时提醒一次；可以等的与模型没答的不提醒，打扰上限与静音照常生效
  actions:
  - id: ACT-URG-01
    kind: flow-step
    step: 准备紧急提醒规则
    how: |-
      负责人：验收执行者。时机：本流程其他动作前。在 acc-wb 加规则 `mail-urgent`（source_type `mail-urgent`，`then: screen`，`notify_urgent: true`，不写 mode）；重启；登记 SRC_STUB 来源 `acc-urg`（source_type mail-urgent，外发范围 full）；CLS_STUB 对 triage-screen 配 p_yes=0.95；渠道 ext CHAN_EXT 与机器人替身在线。
    expected: |-
      通过：Web 的自动规则页显示 mail-urgent 为动作类、模式为只观察。失败：规则被当成提醒类或初始为开。
  - id: ACT-URG-02
    kind: business-action
    step: 观察模式只记"本来会提醒"
    how: |-
      MODEL_STUB 对 triage-draft 用 `urgent-true`；acc-urg 输出一条事件；等处理完；查 `GET /v1/audit/events?type=rule.observed` 与机器人替身记录。
    expected: |-
      通过：生成一条建议且 `proposal.urgent` 为 true；有一条 rule.observed 记"本来会提醒"；没有投递，机器人替身没收到消息。
      失败：观察模式下产生了投递。
    requirement_ids: [REQ-URG-RULE, REQ-WB-14, REQ-WB-27-ITEMS]
  - id: ACT-URG-03
    kind: business-action
    step: 切到开后 urgent 为真的提醒一次，事项仍是建议
    how: |-
      在 Web 自动规则页把 mail-urgent 切到开（auto）；acc-urg 再输出一条新事件（urgent-true）；等处理完；看机器人替身、`GET /v1/deliveries/today` 与建议状态。
    expected: |-
      通过：机器人替身收到一条提醒，内容是标题、摘要、起草理由与指向建议流这一条的 Web 链接；投递不带事项，origin 记来源事件、规则与建议，投递 id 等于建议事项 id；建议仍为 proposed，不计承诺。
      失败：没有提醒、提醒带了事项，或建议被自动接受。
    requirement_ids: [REQ-URG-RULE, REQ-URG-DELIVERY]
  - id: ACT-URG-04
    kind: business-action
    step: 可以等的与没给判断的不提醒
    how: |-
      MODEL_STUB 依次用 `urgent-false`、`urgent-missing`，再让起草失败（5xx），各对 acc-urg 输出一条新事件。
    expected: |-
      通过：三条都成为建议，机器人替身没有新消息，投递数不变。
      失败：任一条产生提醒。
    requirement_ids: [REQ-URG-RULE]
  - id: ACT-URG-05
    kind: business-action
    step: 同一条只提醒一次，并入的与已处置的不提醒
    how: |-
      让 SRC_STUB 对 ACT-URG-03 的事件输出一条合并键相同的新事件（urgent-true）；再在 Web 处置另一条 urgent 建议后让其来源对象更新一次。
    expected: |-
      通过：并入已有建议，没有第二条提醒；已处置的没有提醒。
      失败：重复提醒。
    requirement_ids: [REQ-URG-DELIVERY]
  - id: ACT-URG-06
    kind: business-action
    step: 日上限与静音照常生效
    how: |-
      WEB `PUT /v1/settings/policy` 把 `disturb.daily_cap` 设为当前已推送数；再对 acc-urg 输出一条 urgent-true 新事件；之后在 Web 静音 acc-urg 来源并恢复日上限，再输出一条。
    expected: |-
      通过：两条都不推送到机器人替身，留在 Web 未读提醒里；`GET /v1/deliveries/today` 的 suppressed_daily_cap 与 suppressed_muted 各加 1。
      失败：超限或静音时仍推送。
    requirement_ids: [REQ-URG-DELIVERY]
  - id: ACT-URG-07
    kind: business-action
    step: 规则内容变化后回到观察
    how: |-
      修改 acc-wb 里 mail-urgent 的匹配条件并重启；看自动规则页的模式。
    expected: |-
      通过：模式回到只观察，并记一条 `rule.mode_changed`。
      失败：仍为开。
    requirement_ids: [REQ-URG-RULE]
- id: flow-cli-fields
  name: CLI 能写截止、来源与扩展字段并读回一致，清空截止会取消截止定时；处置清单可从标准输入给
  actions:
  - id: ACT-CLI-01
    kind: business-action
    step: 三个标志写入后回读一致
    how: |-
      `APA_TOKEN=$WRK apa item add --title t1 --project acc-work --deadline 2026-12-24 --origin '{"source":"acc-cli","ref":"X-1"}' --ext '{"k":1}'`；`apa item show <id> --json`；`APA_TOKEN=$OBS apa propose --title p1 --deadline 2026-12-25T10:00:00+08:00`。
    expected: |-
      通过：deadline 为本机时区 2026-12-24T23:59:59；origin 与 ext 与输入一致；建立了截止 Timer；propose 的 deadline 为给定时刻；`apa item list --origin-source acc-cli --origin-ref X-1` 只返回 t1。
      失败：任一字段不一致或无截止 Timer。
    requirement_ids: [REQ-WB-30-ITEM]
  - id: ACT-CLI-02
    kind: business-action
    step: 清空截止后定时取消
    how: |-
      `APA_TOKEN=$WRK apa item update <t1> --deadline ""`；`apa item show <t1> --json`；`tc_advance` 越过原截止。
    expected: |-
      通过：deadline 为空，截止 Timer 已取消，越过原时刻后没有 `item.deadline_passed`。
      失败：截止仍触发。
    requirement_ids: [REQ-WB-30-ITEM]
  - id: ACT-CLI-03
    kind: business-action
    step: import 前缀与非法值被拒
    how: |-
      `apa item add --title t2 --origin '{"source":"import:x"}'`；`--deadline 2026-13-40`；`--origin '不是 JSON'`。
    expected: |-
      通过：三次都退出码 2 且 why 指出字段；没有写入。
      失败：任一被接受。
    requirement_ids: [REQ-WB-30-ITEM, REQ-IMP-ORIGIN]
  - id: ACT-CLI-04
    kind: business-action
    step: 处置清单从标准输入读
    how: |-
      建议流里有三条建议；`printf '<处置清单 JSON>' | APA_TOKEN=$DEL apa proposals apply --file - --evidence "第一条接受，第二条忽略"`，清单只列第一、二条。
    expected: |-
      通过：只动这两条，逐条输出结果，各有 Event 带原话；第三条不变。
      失败：不支持 `-` 或动了未列出的建议。
    requirement_ids: [REQ-WB-30-APPLY]
- id: flow-chat-dispose
  name: 本人在与 Agent 的私聊里处置建议与记进展，凭原话的代答只在私聊里成立，多人会话一律被拒
  actions:
  - id: ACT-CHT-01
    kind: business-action
    step: 插件提供三个代答工具及说明
    how: |-
      `python3 -m pytest plugins/hermes/tests`；查看 `plugins/hermes/tools/plugin.yaml` 与 `plugins/hermes/tools/README.md`。
    expected: |-
      通过：测试通过；注册了 apa_attach、apa_proposals_apply、apa_item_progress，分别调用 `apa attach`、`apa proposals apply --recommended` 或 `--file -`（可按来源、项目收窄）、`apa item progress`；工具说明写明要带本人这一回合的原话、退出码 23 时不换说法重试并告诉本人原因与 Web 链接。
      失败：缺工具或说明缺上述要求。
    requirement_ids: [REQ-CHAT-TOOLS]
  - id: ACT-CHT-02
    kind: business-action
    step: 会话类型按五条顺序判定，多人优先
    how: |-
      运行 `plugins/hermes/tests` 中 `session_kind` 的用例（STUB_HARNESS 的四种入口加 APA_DIRECT_PLATFORMS 组合）：聊天类型 group/channel/thread；平台与来源为空、cli、tui、local；平台在 `APA_DIRECT_PLATFORMS=acc-own` 里且聊天类型为 dm 或空；同一平台但聊天类型为 group；dm 有发送者；dm 无发送者；取不到。
    expected: |-
      通过：依次为 group；direct；direct；group（名单平台加多人仍是 group）；direct；unknown；unknown。不设 APA_DIRECT_PLATFORMS 时名单平台的结果与此前相同。
      失败：任一顺序错误，特别是名单平台加多人判成 direct。
    requirement_ids: [REQ-CHAT-KIND, REQ-WB-23]
  - id: ACT-CHT-03
    kind: business-action
    step: 私聊里按推荐批量处理与按清单处理
    how: |-
      用 STUB_HARNESS 模拟即时通讯私聊入口（dm 带发送者），经 apa_proposals_apply 以 `--recommended --evidence "按建议处理"` 执行；再以清单模式只列一条忽略执行。
    expected: |-
      通过：带推荐的建议各自按推荐处置，每条 Event 的操作者是 Agent、带原话与 session_kind direct；清单模式只动列出的那一条。
      失败：被拒、缺原话或动了未列出的。
    requirement_ids: [REQ-CHAT-EVIDENCE]
  - id: ACT-CHT-04
    kind: business-action
    step: 私聊里补到已有事项与记进展
    how: |-
      私聊入口下经 apa_attach 把一条建议补到 X1（带原话）；经 apa_item_progress 给本人的事项记一条进展（带原话）；再在不带原话的情况下凭 ACT-IGR-08 的 item.progress 授权单记一条。
    expected: |-
      通过：三次都成功；Event 分别带原话或授权单 id。
      失败：任一被拒。
    requirement_ids: [REQ-CHAT-EVIDENCE, REQ-WB-19]
  - id: ACT-CHT-05
    kind: business-action
    step: 多人会话里同样的调用被拒
    how: |-
      STUB_HARNESS 模拟多人会话入口（聊天类型 group，平台在 APA_DIRECT_PLATFORMS 里），重复 ACT-CHT-03 与 ACT-CHT-04 的凭原话调用。
    expected: |-
      通过：每次退出码 23，code 为 `session_not_direct`；账本无变化。
      失败：任一凭原话的调用成功。
    requirement_ids: [REQ-CHAT-EVIDENCE, REQ-CHAT-KIND]
- id: flow-reminder-open
  name: 指定列表里没有到期日的提醒事项也进建议流，改标题仍是同一条，其他列表行为不变
  actions:
  - id: ACT-REM-01
    kind: business-action
    step: undated_lists 里的无到期日提醒产出 reminder.open
    how: |-
      在 Web 来源页登记 `apple-pim-source`（config.kind=reminders，`undated_lists: ["随手记"]`，PATH 前缀 TOOL_STUB_BIN），case 设为录制样本 `rem-undated`（"随手记"与"工作"两个列表各有一条无到期日提醒，另有一条有到期日的）；等一轮；`apa source events <该来源> --json`。
    expected: |-
      通过："随手记"的无到期日提醒为 `reminder.open`，occurred_at 为创建时间，summary 为列表名，关联键为提醒 id；有到期日的仍是 `reminder.due`；"工作"列表的无到期日提醒没有事件。
      失败：类型错误或其他列表行为改变。
    requirement_ids: [REQ-WB-37]
  - id: ACT-REM-02
    kind: business-action
    step: 内置规则 reminder-open 直接进建议流
    how: |-
      看 ACT-REM-01 的 reminder.open 事件的处置与建议流。
    expected: |-
      通过：disposition 为 proposed，命中规则 reminder-open，没有调用模型（CLS_LOG、MODEL_LOG 无新请求）。
      失败：交初筛或未进建议流。
    requirement_ids: [REQ-WB-34]
  - id: ACT-REM-03
    kind: business-action
    step: 改标题后回到同一条事项
    how: |-
      把 case 换成 `rem-undated-renamed`（同一提醒改了标题）；等一轮；再换成 `rem-undated-dated`（补上到期日）；等一轮。
    expected: |-
      通过：两次都按来源对象更新写回原建议，不产生第二条事项；补上到期日后事件类型为 reminder.due，关联键不变。
      失败：产生第二条事项。
    requirement_ids: [REQ-WB-37]
  - id: ACT-REM-04
    kind: business-action
    step: 不配 undated_lists 时行为不变
    how: |-
      另登记一个不带 undated_lists 的 reminders 来源回放同一 case。
    expected: |-
      通过：只有 reminder.due 事件，无 reminder.open。
      失败：产出 reminder.open。
    requirement_ids: [REQ-WB-37]
- id: flow-wb-release
  name: 工作台迭代收尾：规划标记清零、对照测试严格模式通过、e2e 登记齐全、红线与泄漏扫描通过、用户文档与清单同步
  actions:
  - id: ACT-WREL-01
    kind: business-action
    step: 对照测试以严格模式通过，规划标记清零
    how: |-
      在候选提交的干净检出上 `APA_CONFORMANCE_STRICT=1 go test ./tests/conformance/... ./cli/serve/...`；`grep -rn '规划中（v0.2.0）' docs/appendix-b-api-cli.md docs/appendix-c-capability-pack.md`。
    expected: |-
      通过：测试通过；grep 只命中附录 B 开头对规划标记机制的说明，没有任何条目带标记；B.1、B.2、C.14 里为放行而拆出的"已有命令的新增标志/已有路由的新增参数"等行已并回原行。
      失败：仍有带标记的条目或拆出的行，或严格模式失败。
    requirement_ids: [REQ-REL-STRICT]
  - id: ACT-WREL-02
    kind: business-action
    step: e2e 包登记齐全且只用替身
    how: |-
      `.github/e2e/pkgs.sh check`；对本迭代新增的 e2e 包 `grep -rn` 真实服务地址与浏览器驱动。
    expected: |-
      通过：检查通过，新包都在某个 full-*.txt；新包不连真实账号、不调起浏览器。
      失败：有未登记的包，或依赖真实外部服务。
    requirement_ids: [REQ-REL-E2E]
  - id: ACT-WREL-03
    kind: business-action
    step: 红线检查与泄漏扫描通过
    how: |-
      `go run ./tools/redline`；运行仓库的泄漏扫描测试（覆盖 docs/ 与 .omac/）；评审检查主文档没有具体笔记应用名。
    expected: |-
      通过：红线与泄漏扫描都退出码 0；内核不出现笔记应用、邮件工具或宿主名；会话入口识别只在 `plugins/hermes`。
      失败：任一检查失败。
    requirement_ids: [REQ-REL-REDLINE, REQ-REL-LEAK]
  - id: ACT-WREL-04
    kind: business-action
    step: 用户文档与清单同步
    how: |-
      查看 `docs/user/upgrade.md`、用户文档的变更记录、§20.4 清单与写死行数的发布测试（`go test ./tests/release/...`）、§17.3 退出码表、§21.3。
    expected: |-
      通过：upgrade.md 的清单标题与正文为 L1–L24，发布测试通过；变更记录单列必须迁移的条目（至少 WB-25 列表不带全文、WB-26 token 读原文收紧、WB-28 新错误原因、WB-31 名为 none 的模板被拒、WB-34 覆盖包需自加 reminder-open）；§17.3 没有新增行；§21.3 每行第三格保持规定形状。
      失败：任一不同步。
    requirement_ids: [REQ-REL-DOCS]
  - id: ACT-WREL-05
    kind: business-action
    step: CI 与全量 e2e 全绿
    how: |-
      运行 `.github/workflows/ci.yml` 的步骤（web 构建与单测、`go build ./...`、`go test ./...`、红线）与冒烟 e2e；手动触发 `release` 工作流跑全量 e2e。
    expected: |-
      通过：全部退出码 0；没有为变绿而删除或跳过的测试。
      失败：任一失败。
    requirement_ids: [REQ-REL-NOREGRESS]
- id: flow-wb-regression
  name: 工作台迭代不使 v0.2.0 已有验收与 v0.1 验收项回退
  actions:
  - id: ACT-WREG-01
    kind: business-action
    step: 重跑 v0.2.0 既有验收
    how: |-
      在本迭代候选提交上按 `.omac/apa-v02.acceptance.yaml` 的全部流程逐条执行（其环境即 ACT-WBENV-01）。
    expected: |-
      通过：每个 action 达到其 expected；因本迭代有意改变而不再成立的（如列表 detail 改为预览、token 读原文受外发范围约束、抽取候选走合并路径）必须能指出 changes-v0.2.0.md 第十节的条目编号，且该文档已按修订流程同步。
      失败：任一 action 未通过且没有对应的 WB 条目。
    requirement_ids: [REQ-REL-NOREGRESS]
