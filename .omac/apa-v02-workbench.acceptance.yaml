- id: flow-link-material
  name: 本人或 Agent 把笔记库内文档或网址登记为项目的链接型材料，同一位置只有一条，不合法的位置被拒
  actions:
  - id: ACT-LNK-01
    kind: business-action
    step: 在 Web 登记笔记库，非法模板被拒
    how: |-
      WEB 调用 `PUT /v1/settings/note-vaults`，请求体 `{"vaults": [{"name": "acc-vault", "open_url": "notes://open?vault={vault}&file={path}"}]}`；再分别提交：两个同名库、`open_url` 为 `open?file={path}`（无协议）、以 `javascript:`、`data:`、`vbscript:`、`file:` 开头的模板；用 DEL 调一次合法请求；`APA_TOKEN=$OBS curl $APA_URL/v1/note-vaults`。
    expected: |-
      通过：合法请求 200 并记 `policy.changed`；六个非法请求都 400；DEL 被拒（403）；GET /note-vaults 返回 acc-vault 与其 open_url。
      失败：非法模板被保存，或非 Web 能改。
    requirement_ids: [REQ-WB-17, REQ-WB-24-VAULTS]
  - id: ACT-LNK-02
    kind: business-action
    step: 登记库内文档与网址两种链接型材料
    how: |-
      `APA_TOKEN=$WRK apa material add --link "vault:acc-vault/项目/方案 A.md" --title 方案A --project acc-work`；`APA_TOKEN=$WRK apa material add --link "HTTPS://Example.INVALID/doc" --title 外部文档 --project acc-work --kind minutes`；`APA_TOKEN=$OBS apa material show <第一条 id>`；`GET /v1/materials/<id>`。
    expected: |-
      通过：两条都创建（HTTP 201）；第一条 kind 为 reference、`form` 为 `link`、`link` 为原位置、`open_url` 为模板渲染结果且 `{vault}`、`{path}` 各自 URL 编码；第二条位置的协议与主机名已转小写；`apa material show` 对链接型只输出位置与打开地址；记一条内部审计事件。
      失败：form 不是 link、open_url 编码错误或网址未规范化。
