  - id: ACT-LNK-03
    kind: business-action
    step: 同一项目同一位置重复登记返回已有的那条
    how: |-
      以不同标题与 kind 再登记 `vault:acc-vault/项目/方案 A.md` 到 acc-work；以 `https://example.invalid/doc` 再登记一次；把同一库内位置登记到 acc-home。
    expected: |-
      通过：前两次返回已有那条（HTTP 200），标题与 kind 未改；acc-home 新建一条（不同项目可各有一条）。
      失败：同项目同位置产生第二条，或已有条被改。
