    - REQ-G1-2
  - id: ACT-SRC-03
    kind: business-action
    step: 按去重键去重
    how: 下一个周期重复输出同一事件 id；另登记第二个来源，与第一个使用同一去重域，也输出这个 id。
    expected: 通过：只产生一条来源事件和一个事项。失败：产生重复。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-SRC-04
    kind: business-action
    step: 缺必填字段的事件不入账
    how: ACC_SOURCE 输出一条缺 subject 的事件和一条正常事件，末行游标合法。
    expected: 通过：坏事件不进入账本并可在来源页查到原因，正常事件照常入账。失败：坏事件入账，或整批静默丢失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-SRC-05
    kind: business-action
    step: 末行不是合法游标时事件留下、游标不动
    how: ACC_SOURCE 输出一条新事件，末行写非 JSON，退出码 0。
    expected: 通过：事件落盘，游标不变，本次按临时失败计数；下一周期重复输出同一事件时不产生重复。失败：事件丢失或游标前进。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-SRC-06
    kind: business-action
    step: 退出码 1 退避重试
    how: ACC_SOURCE 连续返回退出码 1。
    expected: 通过：按退避重试，连续失败数在来源页可见，游标不动，不产生打扰。失败：不重试或被停用。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-SRC-07
    kind: business-action
    step: 退出码 2 生成 needs_input
    how: ACC_SOURCE 返回退出码 2。
    expected: 通过：生成一个 needs_input 事项找本人，游标不动；其他来源不受影响。失败：只写日志。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-SRC-08
    kind: business-action
    step: 退出码 3 停用并通知
    how: ACC_SOURCE 返回退出码 3。
    expected: 通过：来源被停用，产出健康类投递，事件流有 source.failed。失败：继续被调度。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-SRC-09
    kind: business-action
    step: 超时按临时失败
    how: ACC_SOURCE 睡眠超过 30 秒。
    expected: 通过：进程被杀，计入失败和超时统计，游标不动，下次仍重试。失败：Run 卡住。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-SRC-10
    kind: business-action
    step: 启停来源
    how: 运行 `APA_TOKEN=$DEL apa source disable <id>`，观察 3 分钟；再 `apa source enable <id>`。
    expected: 通过：停用期间无 Run，启用后恢复，事件不漏。失败：停用后仍在运行。
    requirement_ids:
    - REQ-G1-2
- id: flow-source-rss
  name: RSS 或 Atom 订阅的新条目进入流水线
  actions:
  - id: ACT-RSS-01
    kind: business-action
    step: 拉取新条目
    how: 启动本地 HTTP 服务提供 RSS 文件，用 `apa source add` 登记附带的 RSS 拉取程序；等一个周期；追加一条新 item，再等一个周期。对 Atom 文件重复一次。
    expected: 通过：每个条目只产生一条来源事件；未变更的条目不重复。失败：重复，或漏新条目。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-RSS-02
    kind: business-action
    step: 格式错误或不可达时不丢游标
    how: 把 RSS 文件改成非法 XML；再停止本地服务。
    expected: 通过：两种情况都不产生坏事件，游标不动，来源页可见失败；恢复后拉到错过的条目。失败：游标前进导致漏事件。
    requirement_ids:
    - REQ-G1-2
- id: flow-source-http-json
  name: 通用 HTTP JSON 轮询按声明的字段映射转成标准事件
  actions:
  - id: ACT-HTTP-01
    kind: business-action
    step: 轮询并映射
    how: 本地服务返回 JSON 数组。用 `apa source add` 登记附带的通用 HTTP JSON 程序，在 config 中声明地址和字段映射；等一个周期；新增一条再等一个周期。
    expected: 通过：映射后的事件 id、type、subject、occurred_at 正确，只入新增的那条。失败：字段错误或重复。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HTTP-02
    kind: business-action
    step: HTTP 错误时按失败处理
    how: 让本地服务依次返回 500 和 401。
    expected: 通过：500 按临时失败退避；401 生成 needs_input；游标都不动。失败：错误被当作空结果并推进游标。
    requirement_ids:
    - REQ-G1-2
- id: flow-source-dir-watch
  name: 本地目录的文件变化进入流水线
  actions:
  - id: ACT-DIR-01
    kind: business-action
    step: 新建和修改文件产生事件
    how: 用 `apa source add` 登记附带的本地目录监视程序，目录 /tmp/acc/watch；新建 a.md，修改 a.md，各等一个周期。
    expected: 通过：新建和修改各产生一条事件，未变更时不重复。失败：漏事件或重复。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-DIR-02
    kind: business-action
    step: 目录不存在时报告配置失败
    how: 把登记目录改为不存在的路径。
    expected: 通过：退出码 2 语义：生成 needs_input，游标不动。失败：静默返回空结果。
    requirement_ids:
    - REQ-G1-2
- id: flow-webhook
  name: 外部系统推送的事件落盘后才确认，重放不产生重复（场景七）
  actions:
  - id: ACT-HOOK-01
    kind: business-action
    step: 创建接收地址和密钥
    how: 运行 `APA_TOKEN=$DEL apa source webhook create`，方案选 GitHub 类 HMAC。再用 OBS 运行一次。
    expected: 通过：DEL 拿到 URL 和只显示一次的密钥，并记 Event；OBS 退出码 4。失败：密钥可再次查看，或 OBS 能创建。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-02
    kind: business-action
    step: 签名正确的请求落盘后回 2xx
    how: '用密钥计算 HMAC，带 `X-Hub-Signature-256`、`X-GitHub-Delivery: d-1`、`X-GitHub-Event: issues`，`POST /ingest/{source_id}`。'
    expected: 通过：回 2xx；`apa source ingests` 显示原始 payload、校验结果和转换出的事件；进入同一流水线生成 proposed。失败：未生成，或没有入站记录。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-03
    kind: business-action
    step: 签名错误回 401 且不存请求体
    how: 沿用 ACT-HOOK-02 的 URL、payload 和请求头，只把 `X-Hub-Signature-256` 改成错误值，并换一个新的 `X-GitHub-Delivery`，再 `POST /ingest/{source_id}`。
    expected: 通过：回 401；入站记录只有元数据，没有请求体；不产生事件。失败：回 2xx 或保存了请求体。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-04
    kind: business-action
    step: 投递 id 幂等
    how: 重发 ACT-HOOK-02 的同一投递 id；再发两次不带投递 id 且 payload 相同的请求。
    expected: 通过：回 2xx，不产生新事件或新事项；后者按 payload 哈希幂等。失败：产生重复。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-05
    kind: business-action
    step: 强杀不丢已确认的事件
    how: 循环发送不同投递 id 的请求并记录已回 2xx 的 id，期间 `kill -9 apa serve`，重启后检查。
    expected: 通过：每个已回 2xx 的 id 都有入站记录，并最终处理完成。失败：有已回 2xx 的事件丢失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-06
    kind: business-action
    step: 请求体和频率限制
    how: 发超过限制的请求体，再高频发送超过频率限制的请求。
    expected: 通过：分别回 413 和 429，内核不受影响。失败：超限被接收，或内核崩溃。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-07
    kind: business-action
    step: 平台握手
    how: 用 Slack 类方案的 source，发 type=url_verification 且带 challenge 的签名请求。
    expected: 通过：同步返回 challenge。失败：握手失败。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-08
    kind: business-action
    step: 通用共享 token 方案
    how: 用通用 token 方案的 source，分别带正确和错误的 token 发送。
    expected: 通过：正确回 2xx，错误回 401。失败：错误 token 被接受。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-09
    kind: business-action
    step: 转换脚本处理特殊格式
    how: 在 Web 来源页给 source 登记转换脚本（stdin JSON，stdout 标准事件 JSONL），发送一条请求；再让脚本返回退出码 1。
    expected: 通过：第一次按转换结果入流水线；第二次按拉取型语义重试，原始 payload 不丢。失败：payload 丢失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-10
    kind: business-action
    step: 修好映射后重放不重复
    how: 让映射缺一个字段使事件转换失败，用 `apa source ingests` 查看，修好后运行 `APA_TOKEN=$DEL apa source replay <入站记录>` 两次。
    expected: 通过：第一次生成事项，第二次绕过投递 id 幂等但被事件去重拦住，不产生重复事项。失败：产生重复事项。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-11
    kind: business-action
    step: 轮换密钥，新旧短期并存
    how: 运行 `apa source webhook rotate`，分别用新旧密钥签名发送；等待并存期结束后再用旧密钥发送。
    expected: 通过：并存期内都回 2xx；期满后旧密钥回 401。失败：立即中断，或旧密钥一直有效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-12
    kind: business-action
    step: 接收密钥只能写事件
    how: 用 webhook 接收密钥作 Bearer 请求 `GET /v1/items` 和 `POST /v1/items`。
    expected: 通过：都被拒绝。失败：能读或能写账本。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-HOOK-13
    kind: business-action
    step: 推拉结合不重复
    how: 让拉取 source 和 webhook source 登记同一去重域，用同一事件 id 各产生一次。
    expected: 通过：只有一个事项。失败：两个事项。
    requirement_ids:
    - REQ-G1-2
- id: flow-material-owned
  name: 项目材料有版本、可检索，低风险直写，高风险要本人确认
  actions:
  - id: ACT-MAT-01
    kind: business-action
    step: 纪要类直接生效
    how: 运行 `APA_TOKEN=$WRK apa material commit <新材料> --from note.md --reason 周会 --kind 纪要`，project=acc-open，再运行 `apa material show <id>`。
    expected: 通过：修订成为 current，actor 为 agent，事件流有 material.revised，在"agent 变更"视图可见。失败：修订未生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-02
    kind: business-action
    step: 方案类进入确认
    how: 运行 `apa material commit` 提交 kind=方案的修订。
    expected: 通过：状态 proposed，不是 current；决策待办有确认项，Web 可看 diff；事件流有 material.revision_proposed。失败：直接生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-03
    kind: business-action
    step: 确认或拒绝修订
    how: 在 Web 确认一条 proposed 修订，拒绝另一条。
    expected: 通过：确认的成为 current，旧修订变 superseded；拒绝的不生效且内容保留。失败：内容丢失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-04
    kind: business-action
    step: 修订内容追加不改
    how: 连续 commit 三次，运行 `apa material show <id> --rev <旧修订>`，并在 Web 查看版本列表和 diff。
    expected: 通过：旧修订内容不变，每条有 actor、reason、based_on；diff 正确。失败：旧内容被改写。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-05
    kind: business-action
    step: 基线变化时直写冲突
    how: 两次 commit 用同一 based_on 提交 direct 类修订。
    expected: 通过：后一次退出码 6。失败：静默覆盖。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-06
    kind: business-action
    step: proposed 修订基线变化时提示
    how: 用旧 based_on 提交 proposed 修订，在 Web 确认。
    expected: 通过：可入队；确认时显示"基线已变化"，可选基于当前重提或仍然采用。失败：无提示。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-07
    kind: business-action
    step: 回退只在 Web
    how: 用 DEL 请求 `POST /v1/materials/{id}/revert`；再在 Web 回退一次 direct 修订。
    expected: 通过：token 请求被拒绝；Web 回退新增一条内容等于旧快照的修订，历史不改。失败：token 能回退，或历史被改。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-08
    kind: business-action
    step: 附件内容寻址
    how: '`apa blob put` 上传图片，在正文用 apa://blob/<hash> 引用；上传相同内容一次；用 `apa blob get` 取回。'
    expected: 通过：两次 hash 相同，只存一份，内容一致。失败：hash 不稳定，或内容不一致。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-09
    kind: business-action
    step: 中文全文检索
    how: 提交正文含"登录超时的根因"的材料，运行 `apa material search 超时`，并在 Web 搜索框搜同一词；再用 `apa material list` 按项目、kind 筛选。
    expected: 通过：能命中，结果只有 id、标题、片段；Web 和 CLI 一致；筛选正确。失败：中文搜不到，或返回全文。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-10
    kind: business-action
    step: context 不带正文
    how: 运行 `apa context --scope project --project acc-open`。
    expected: 通过：只含标题和变更摘要，不含材料正文；正文要用 `apa material show`。失败：带出正文。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-11
    kind: business-action
    step: 写入策略可在 Web 调整
    how: 在 Web 设置页把纪要改为 proposed，再 commit 一次纪要。
    expected: 通过：这次进入确认流，变更记 Event。失败：策略不生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-12
    kind: business-action
    step: observer 不能提交修订
    how: 运行 `APA_TOKEN=$OBS apa material commit <id> --from note.md --reason x`。
    expected: 通过：退出码 4。失败：修订生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-MAT-13
    kind: business-action
    step: 事项与材料建立类型化关联
    how: 用 `apa item relate` 把事项和材料按"依据"关联，再在 Web 项目的材料视图查看。
    expected: 通过：两边都能看到带类型的关联，变更记 Event。失败：关联丢失或没有类型。
    requirement_ids:
    - REQ-G1-2
- id: flow-no-repo-guideline
  name: 无仓库项目也有处理规则，由 context 带给 agent，不渲染文件
  actions:
  - id: ACT-NRG-01
    kind: business-action
    step: 写处理规则并生效
    how: 在 Web 给 acc-home 写 Guideline，只填"处理规则"一节并确认。
    expected: 通过：其余小节留空也可生效。失败：要求填写其他小节。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-NRG-02
    kind: business-action
    step: agent 经 context 获知，不生成文件
    how: 运行 `apa context --scope project --project acc-home`，再运行 `apa material show <规范 id>`。
    expected: 通过：context 只带标题和变更摘要；show 回正文；没有任何 AGENTS.md 被渲染。失败：context 带正文，或渲染文件。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-NRG-03
    kind: business-action
    step: 无仓库项目不做缺规范检测
    how: 新建无 repos 无规范的项目，等一个检测周期。
    expected: 通过：不产生起草动作。失败：产生起草事项。
    requirement_ids:
    - REQ-G1-2
- id: flow-event-subscribe
  name: 系统和脚本可以订阅账本变化，至少一次且游标自持
  actions:
  - id: ACT-EVT-01
    kind: business-action
    step: 跟随事件流
    how: 运行 `APA_TOKEN=$OBS apa events --follow`，另一终端新建并转移一个事项。
    expected: 通过：实时收到 item.created、item.phase_changed；信封只有类型、对象 id、标题、actor、时间，序号递增；正文、reason、证据不在信封内。失败：带正文，或序号乱。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-EVT-02
    kind: business-action
    step: 从游标续读
    how: 停止跟随，再产生三条变更，运行 `apa events --follow --cursor <最后序号>`。
    expected: 通过：恰好补上这三条，无遗漏。失败：有遗漏。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-EVT-03
    kind: business-action
    step: API 读取和权限
    how: 用 OBS 请求 `GET /v1/events?cursor=0`（SSE 或长轮询）；再不带 token 请求。
    expected: 通过：前者返回事件，后者 401。失败：无凭据可读。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-EVT-04
    kind: business-action
    step: 只开放登记类型
    how: 遍历一段时间内 `GET /v1/events` 返回的所有 type，与附录 B.4 比对。
    expected: 通过：所有 type 都在 B.4 清单中。失败：出现未登记类型。
    requirement_ids:
    - REQ-G1-2
- id: flow-channel-protocol
  name: 投递领取协议的幂等、版本和回答人校验由内核保证
  actions:
  - id: ACT-CHP-01
    kind: business-action
    step: 长轮询领取和租约
    how: 用 CHAN 请求 `GET /v1/deliveries/next?wait=5` 领到投递，不回报，等租约到期再次领取。
    expected: 通过：state=claimed，期间其他消费者领不到；到期后可再次领取，投递 id 不变。失败：同时被两方领取，或永远领不到。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-02
    kind: business-action
    step: 渠道由密钥确定
    how: 在 Web 设置页新签发渠道名 acc-chan2 的 ext 密钥，用它请求路由到 acc-chan 的投递。
    expected: 通过：领不到。失败：跨渠道领取。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-03
    kind: business-action
    step: 送达回报要带当前版本
    how: 领取后在 Web 修改事项使版本变化，再 `POST /v1/deliveries/{id}/ack` 带旧版本号。
    expected: 通过：HTTP 409，投递转 superseded。失败：旧版本 ack 成功。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-04
    kind: business-action
    step: 失败回报触发退避重试
    how: 连续 `POST /v1/deliveries/{id}/fail`，记录每次可重新领取的时间。先按默认配置验证第 1 次重试约 1 分钟后可领，再把重试间隔配置调小跑完 5 次。
    expected: 通过：默认节奏为 1、3、7、15、30 分钟共 5 次；超限后转 fallback_web，Web 未读可见。失败：节奏不符，或超限后丢失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-05
    kind: business-action
    step: 回答人不在白名单被拒绝
    how: '`POST /v1/deliveries/{id}/answer`，回答人为白名单外账号，然后回答人缺失再发一次。'
    expected: 通过：都被拒绝，事项仍是 needs_input，留有拒绝记录。失败：回答生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-06
    kind: business-action
    step: ref 不符被拒绝
    how: '`POST /v1/deliveries/{id}/answer`，回答人正确，ref 与送达时不同。'
    expected: 通过：被拒绝。失败：回答生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-07
    kind: business-action
    step: 只认第一次回答
    how: 用正确的回答人和 ref 回答两次，选项不同。
    expected: 通过：第二次 HTTP 409（语义同退出码 6），返回已有结果。失败：结果被覆盖。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-08
    kind: business-action
    step: 吊销密钥立即生效
    how: 在 Web 吊销 CHAN，紧接着用它领取和回报。之后重新签发。
    expected: 通过：立即被拒绝（401）。失败：继续可用。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-09
    kind: business-action
    step: 密钥只能做渠道动作
    how: 用 CHAN 请求 `GET /v1/items` 和 `POST /v1/items/{id}/decide`。
    expected: 通过：都被拒绝。失败：越权成功。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-10
    kind: business-action
    step: 一次性表单链接
    how: 配一个只能发文字的渠道，产生普通决策，打开链接作答；再次打开；另造一条，按 ACT-ENV-10 运行 `tc_advance 86460`（推进 24 小时加 1 分钟）后打开。
    expected: 通过：第一次可答且只针对该决策，不能读其他账本数据；第二次失效；过期链接失效（默认 24 小时）。失败：可重复使用，或可访问账本。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-CHP-11
    kind: business-action
    step: 协议一致性自测
    how: 用 `apa ext check` 自测 随包的即时通讯渠道 ext（CHAN_EXT），再自测一个故意不做幂等的 ext。
    expected: 通过：前者覆盖领取、幂等、回报、版本冲突、回答，全部通过；后者被指出幂等失败。失败：坏 ext 也通过。
    requirement_ids:
    - REQ-G1-2
- id: flow-chain-depth
  name: 自动链路有上限，超限只记录不派发
  actions:
  - id: ACT-DEP-01
    kind: business-action
    step: 深度沿规则和回执继承
    how: 让规则拉起运行→运行委派→回执→规则再命中，走 3 轮，运行 `apa why <id>`。
    expected: 通过：每条 Event 的 chain_depth 递增；挂靠消息继承所挂事项的深度。失败：深度不增或被重置。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-DEP-02
    kind: business-action
    step: 超阈值只记录
    how: 把事项经规则循环到深度超过 8（可在配置把阈值调到 2 以缩短）。
    expected: 通过：不再派发，只记录，产出健康类投递，健康视图有链路熔断。失败：继续派发。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-DEP-03
    kind: business-action
    step: 本人重新委派才清零
    how: 在 Web 对 ACT-DEP-02 中被熔断的事项重新委派给 work-host.cli，运行 `apa why <id>`。另取一个 chain_depth 大于 0 的事项，先用 `apa ask` 提交决策请求并在 Web 回答，再让它的一个 Timer 到期，分别查看 chain_depth。
    expected: 通过：新链路深度从头开始。经 `apa ask` 或定时都不清零。失败：提问或定时后深度被清零。
    requirement_ids:
    - REQ-G1-2
- id: flow-purge
  name: 本人可彻底删除内容，事件序号和订阅游标不被破坏
  actions:
  - id: ACT-PRG-01
    kind: business-action
    step: 物理删除事项
    how: 建事项，正文和证据写 MARKER-PURGE，带一个 blob。记录它的 Event 序号。在 Web 设置页执行物理删除。运行 `grep -r MARKER-PURGE $APA_HOME`。
    expected: 通过：投影、正文和无其他引用的 blob 都删除；Event 保留序号、类型、对象 id、时间、actor，内容字段替换为墓碑；另记一条删除事件；grep 无匹配（SQLite 文件需完成清理后检查）。失败：内容仍可搜到。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-PRG-02
    kind: business-action
    step: 有引用的 blob 保留
    how: 两个材料引用同一 blob，删除其中一个。
    expected: 通过：blob 仍存在，另一材料可读取。失败：blob 被删。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-PRG-03
    kind: business-action
    step: 游标不受影响
    how: 运行 `apa events --cursor <删除前序号>` 和 `apa why <已删对象>`。
    expected: 通过：序号连续；信封显示墓碑，不泄露内容。失败：序号断裂，或内容泄露。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-PRG-04
    kind: business-action
    step: 物理删除只在 Web
    how: 用 DEL 请求 `POST /v1/settings/purge`。
    expected: 通过：被拒绝，内容不变。失败：删除生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-PRG-05
    kind: business-action
    step: 墓碑不计入统计
    how: 物理删除一条已丢弃的建议，再触发声明 `event_stats` 的判断型。
    expected: 通过：统计不计该条。失败：仍被计入。
    requirement_ids:
    - REQ-G1-2
- id: flow-retention
  name: 运行数据按期清理，账本事实不清理
  actions:
  - id: ACT-RET-01
    kind: business-action
    step: Ingest 请求体过期只留元数据
    how: 确认默认 30 天；把配置调为 1 分钟后等待清理，运行 `apa source ingests`。
    expected: 通过：请求体消失，元数据还在；未到期的不受影响；此时 replay 明确报错。失败：元数据也被删，或默认不是 30 天。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-RET-02
    kind: business-action
    step: 运行目录过期清理
    how: 确认默认 14 天；把配置调为 1 分钟后等待清理。
    expected: 通过：目录被清理；Run 记录和账本事实还在；在途运行的目录不被清理。失败：清掉在途目录，或 Run 记录丢失。
    requirement_ids:
    - REQ-G1-2
- id: flow-bg-main-session
  name: 带标签的事项由主会话角色后台处理、委派，并等回执接续（场景四，替身版：acc-stub）
  actions:
  - id: ACT-BGM-01
    kind: flow-step
    step: 准备规则和权限上限
    how: 负责人：验收执行者，依赖 ACT-ENV-06。在 $APA_HOME/packs/background-run 加入附录 C.12 的 handle-labelled 规则：when tag_any=[agent-ok]，do start_background_run，runner=main_session，access=edit，cwd=run_dir，初始 observe。在 Web 把 acc-stub 的权限上限设为 edit，默认 harness 设为 acc-stub。acc-work 允许的执行者为 [work-host.cli]。
    expected: 通过：`GET /v1/rules` 显示规则为 observe。失败：规则未加载或模式不对。
  - id: ACT-BGM-02
    kind: business-action
    step: observe 只记录不拉起
    how: 让 acc-work 的一个 tag=agent-ok 事项进入 open，运行 `apa run list` 和 `apa why <id>`。
    expected: 通过：没有 Run；有"本来会做什么"的记录。失败：拉起了运行。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGM-03
    kind: business-action
    step: 切到 auto 后拉起运行
    how: 在 Web 把规则切到 auto，让另一个 tag=agent-ok 事项进入 open。
    expected: 通过：Run category=background、runner=main_session、launch=headless，记录规则 id、策略版本和 access=edit；运行者不占事项的 assignee。失败：缺字段。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGM-04
    kind: business-action
    step: 运行者读上下文并委派
    how: 事项正文写"把修复交给执行者"。STUB_HARNESS 切到脚本：用运行凭据依次调用 `apa context --scope item`、`apa delegate --parent <该事项> --assignee work-host.cli`，再写一条进展后退出。
    expected: 通过：事件流里 context 读取与 delegate 写入的操作者都是该运行；子事项 assignee=work-host.cli 且带 unattended 标记；运行进程在 APA 所在主机。失败：子事项缺 unattended，或运行凭据的委派被记成其他身份。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGM-05
    kind: business-action
    step: 运行结束，父事项等待
    how: 运行者写进展并退出，查看 Run 和父事项。
    expected: 通过：Run state=succeeded；父事项 waiting；事项记录 session_id；运行凭据已失效（用它调 `apa inbox` 返回 3）。失败：凭据仍可用。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGM-06
    kind: business-action
    step: 回执后下一次运行接续
    how: 用 WRK 对子事项 `apa report --outcome <完成> --pr https://example.invalid/pr/11`。
    expected: 通过：子事项 done，父事项回 open；规则再次命中，新 Run 的 chain_depth 加一；`apa why` 可回放。失败：链路深度不增加，或没有接续。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGM-07
    kind: business-action
    step: 全程回放
    how: 运行 `APA_TOKEN=$DEL apa why <父事项>`，并对照 §15.1 示例。
    expected: 通过：能回放触发、规则、授权依据、委派、回执和回答。失败：缺任一环。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGM-08
    kind: business-action
    step: 运行结束时仍是 open 交本人
    how: 用 acc-stub 运行，让 STUB_HARNESS 不回执就退出，事项保持 open。
    expected: 通过：事项转 needs_input，附失败摘要，选项为重新运行、改派、放弃；不自动再次拉起。失败：循环拉起。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGM-09
    kind: business-action
    step: 指定 harness
    how: 规则声明 harness=acc-stub，另一条不声明。
    expected: 通过：前者用 acc-stub，后者用 Web 设置的默认 harness。失败：选错 harness。
    requirement_ids:
    - REQ-G1-6
- id: flow-bg-guards
  name: 无人值守运行的约束由内核强制，运行者不能替本人决定（替身版）
  actions:
  - id: ACT-BGG-00
    kind: flow-step
    step: 准备在途运行与运行凭据
    how: 负责人：验收执行者。时机：本流程开始时，依赖 ACT-BGM-01。规则切 auto，让 acc-work 的一个 tag=agent-ok 事项进入 open；STUB_HARNESS 切到"挂起不退出"。从运行目录记录的环境取出运行凭据，导出为 `RUN_ENV`（含 APA_RUN、APA_TOKEN、APA_RUN_CONTEXT）。下文"在运行内"指在 `env $RUN_ENV` 下执行命令。
    expected: 通过：`apa run list` 有一条 running 的 Run，RUN_ENV 三个变量都有值。失败：未拉起运行或取不到运行凭据。
  - id: ACT-BGG-01
    kind: business-action
    step: 运行者不能代答
    how: 在运行内用运行凭据执行 `apa decide <id> --option A --evidence x`、`apa accept <id> --evidence x`、`apa dismiss <id> --reason x --evidence x`。
    expected: 通过：全部退出码 4，各记一条拒绝事件，事项不变。失败：任一生效。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-02
    kind: business-action
    step: 委派给名单外返回 21
    how: 在运行内用运行凭据运行 `apa delegate --parent <目标> --assignee other-host.cli`。
    expected: 通过：退出码 21；没有名单外子事项；该拒绝在事件流可查。失败：写入名单外子事项。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-03
    kind: business-action
    step: 同一事项只有一个运行
    how: STUB_HARNESS 挂起时再次触发同一事项的规则；此时运行 `apa context --scope item`。
    expected: 通过：跳过并记 Event，没有第二个 Run；context 提示在途运行；排队中的 Run 也算在途。失败：同时有两个 Run。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-04
    kind: business-action
    step: 失败或超时交本人
    how: STUB_HARNESS 分别返回退出码 1 和挂起到超时。
    expected: 通过：两种情况事项都转 needs_input，只有一次 Run，不自动重试。失败：自动重试。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-05
    kind: business-action
    step: 重启时无存活进程按失败
    how: STUB_HARNESS 运行中 `kill -9` 内核和它，然后重启。
    expected: 通过：Run state=failed，事项转 needs_input。失败：Run 永远 running。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-06
    kind: business-action
    step: 权限档位超过上限不拉起
    how: 把上限设回默认 read，规则仍声明 access=edit，命中。
    expected: 通过：不拉起，事项转 needs_input，说明档位超限。失败：按 edit 拉起。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-07
    kind: business-action
    step: 声明未覆盖档位时不拉起
    how: 提交只声明 read 的 harness，规则声明 access=edit，上限设 full。
    expected: 通过：不拉起，事项转 needs_input。失败：拉起或回退到其他档位。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-08
    kind: business-action
    step: 默认上限为 read
    how: 全新数据目录上查看设置页的运行权限上限。
    expected: 通过：每个 harness 默认 read。失败：默认高于 read。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BGG-09
    kind: business-action
    step: 策略变更后复核
    how: 在运行结束后把规则切回 observe，再在 Web 回答一个等待续接的决策。
    expected: 通过：复核不通过，事项转 needs_input，不续接，在途工作不被撤销但有通知。失败：仍然续接。
    requirement_ids:
    - REQ-G1-6
- id: flow-bg-task-runner
  name: 任务型运行者在子事项上自己完成工作（替身版：acc-stub）
