  - id: ACT-CMD-05
    kind: business-action
    step: delegate 可以登记随发行附带的拉取程序
    how: 运行 `APA_TOKEN=$DEL apa source add`，登记附带的 RSS 拉取程序，不带自定义命令。
    expected: 通过：登记成功。失败：被拒绝。
    requirement_ids:
    - REQ-G1-2
- id: flow-outcall-limits
  name: 外呼调用器是唯一出口，超限的运行排队不丢，长短任务互不挤占
  actions:
  - id: ACT-OUT-01
    kind: business-action
    step: 长时运行超限时排队
    how: 在 config.yaml 设 max_subprocesses=1，STUB_HARNESS 切到挂起 2 分钟。同时触发三个不同事项的任务型，运行 `apa run list`。
    expected: 通过：同时只有一个 running，其余 queued；前一个结束后依次执行；没有 Run 被丢弃或改为其他方式执行；`apa health` 显示排队数和最长等待时间。失败：超过额度同时运行，或有 Run 丢失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-OUT-02
    kind: business-action
    step: 长时运行占满时来源拉取照常
    how: 保持 ACT-OUT-01 的配置（max_subprocesses=1，STUB_HARNESS 挂起 2 分钟），触发一个任务型使长时运行额度占满；此时让一个周期为每分钟的脚本 Source（ACT-SRC-01 登记的 ACC_SOURCE）到期，同时触发一次判断型调用（CLS_STUB 正常返回）。
    expected: 通过：Source 的 Run 在短任务队列按时执行；模型调用不受影响。失败：来源拉取或模型调用被长时运行阻塞。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-OUT-03
    kind: business-action
    step: 短任务额度和优先级
    how: 设 max_short_subprocesses=1，同时登记三个慢速脚本 Source，再在 Web 重放一条入站记录。
    expected: 通过：同时只有一个短任务运行；本人触发的重放排在定时拉取之前。失败：超过额度，或优先级不对。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-OUT-04
    kind: business-action
    step: 同一来源不重复入队
    how: 一个每分钟运行、每次耗时 3 分钟的脚本 Source，观察 5 分钟。
    expected: 通过：同一来源任何时刻最多一个排队或运行中的 Run；游标不漏事件。失败：堆积多个 Run。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-OUT-05
    kind: business-action
    step: 子进程不继承内核环境
    how: 启动 `apa serve` 前 export ACC_SECRET=leak，让 STUB_HARNESS 记录环境变量。
    expected: 通过：记录里没有 ACC_SECRET，也没有模型 api_key；有 PATH、HOME、XDG 变量，以及 APA_URL、APA_TOKEN、APA_RUN、APA_PROJECT。失败：环境被继承。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-OUT-06
    kind: business-action
    step: 超时杀进程组
    how: 提示词模板设 timeout=1m，STUB_HARNESS 挂起并派生一个子进程。
    expected: 通过：约 1 分钟后 Run state=timeout，父子进程都不在（`ps` 可证实），事项转 needs_input。失败：有残留进程，或事项卡在运行中。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-OUT-07
    kind: business-action
    step: 重启恢复
    how: 有一个 running、一个 queued 的 Run 时 `kill -9 apa serve` 和 STUB_HARNESS 进程，然后重启。
    expected: 通过：running 的按失败处理（事项转 needs_input）；queued 的重新执行。失败：Run 卡在 running，或 queued 丢失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-OUT-08
    kind: business-action
    step: 运行目录保存资料和输出
    how: 运行一次任务型后查看 $APA_HOME/runs/<run-id>/，并查看实际送给 harness 的提示词。
    expected: 通过：目录含资料文件和输出；提示词只含固定模板和事项 id；外部正文只在资料文件里。失败：外部正文拼进提示词。
    requirement_ids:
    - REQ-G1-2
- id: flow-source-contract
  name: 拉取型来源按统一契约运行，事件不丢不重，失败有明确处置
  actions:
  - id: ACT-SRC-01
    kind: flow-step
    step: 登记验收脚本来源
    how: 负责人：验收执行者。时机：flow-source-contract 的第一步，flow-env-baseline 全部完成之后、ACT-SRC-02 之前。写脚本 ACC_SOURCE（读 stdin JSON，按开关决定输出和退出码，并把收到的 stdin 存盘）。在 Web 来源页登记：type=script、source_type=acc、周期每分钟、超时 30 秒。
    expected: 通过：`APA_TOKEN=$OBS apa source show <id>` 显示登记内容。失败：登记不成功。
  - id: ACT-SRC-02
    kind: business-action
    step: 正常拉取并推进游标
    how: ACC_SOURCE 输出两条标准事件（id、type、subject、occurred_at 齐全）和末行 `{"cursor":"c1"}`，退出码 0。等一个周期后查看来源页和下一次收到的 stdin。
    expected: 通过：两条事件入流水线；下次 stdin 的 cursor=c1，并含 source_id、config、window、run_id；来源页更新最近成功时间。失败：cursor 未推进或 stdin 缺字段。
