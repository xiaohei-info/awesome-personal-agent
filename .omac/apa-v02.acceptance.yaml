    step: 运行凭据只限目标范围
    how: 在 ACT-BGT-01 的运行内（STUB_HARNESS 切到挂起，取运行凭据 RUN_ENV）用运行凭据执行：写目标子事项；建子事项和 Timer；写无关事项；`apa item transition` 改无关事项；建项目。
