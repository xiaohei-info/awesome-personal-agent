    - REQ-G1-2
  - id: ACT-MAP-04
    kind: business-action
    step: 未命中时不猜
    how: 在 /tmp 运行 `apa context --scope cwd`。
    expected: 通过：无项目作用域，不返回某个项目的事项。失败：猜测了项目。
