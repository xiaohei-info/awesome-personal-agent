    requirement_ids:
    - REQ-G1-6
- id: flow-forward-allowlist
  name: 白名单外的跟进消息进不了无人值守链路，内核按运行身份过滤（替身版）
  actions:
  - id: ACT-FWD-01
    kind: flow-step
    step: 配置白名单和消息
    how: 负责人：验收执行者，依赖 ACT-BGG-00 的做法。在 Web 把转发白名单设为 alice。按 ACT-BGM-04 的脚本产生一个无人值守子事项（unattended），用脚本来源（发送者字段可控）产生挂到它的三条消息：alice 已核实、bob 已核实、alice 未核实（sender_verified=false）；再加一条无发送者的。之后让 STUB_HARNESS 在该子事项上起一次挂起的运行并取运行凭据 RUN_ENV。
    expected: 通过：Web 事项页能看到四条。失败：消息未挂靠。
  - id: ACT-FWD-02
    kind: business-action
    step: 运行者只看到白名单内的消息
    how: 在运行内（`env $RUN_ENV`）运行 `apa context --scope item`；查看运行目录的账本快照；再用 `apa item show` 读。
    expected: 通过：只有 alice 已核实这条；其他三条在所有入口都读不到。失败：有泄露。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-FWD-03
    kind: business-action
    step: 子事项的执行者同样被过滤
    how: 用 WRK（子事项的 assignee）运行 `apa context --scope item`。
    expected: 通过：按 unattended 过滤，只有 alice 已核实这条。失败：委派后绕过白名单。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-FWD-04
    kind: business-action
    step: 未进白名单的消息本人可见，不算已处理
    how: 打开 Web 事项页；用 DEL 以交互式会话身份（不设 APA_RUN）运行 `APA_TOKEN=$DEL APA_SESSION=acc-session-1 apa context --scope item`；再用 `apa report --ack-cursor`。
    expected: 通过：Web 和交互式会话的 context 都能看到全部四条；ack 后这三条仍未 processed；运行凭据（主会话角色的后台运行）读不到它们。失败：未过滤的消息算已处理，或运行凭据读到。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-FWD-05
    kind: business-action
    step: 白名单变更立即生效
    how: 在 Web 把 bob 加入白名单，运行者再读 context；然后移除，再读。
    expected: 通过：加入后能读到，移除后读不到，无需重启，变更记 allowlist.changed。失败：变更不生效。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-FWD-06
    kind: business-action
    step: 挂靠消息不拉起运行
    how: 后台会话已退出时，发 alice 的新消息；观察 2 分钟后，再触发下一次运行。
    expected: 通过：消息本身不产生新 Run；下次运行才带上。失败：消息拉起新运行。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-FWD-07
    kind: business-action
    step: 退回判断流后不进入无人值守
    how: '关闭子事项，让 bob 的消息退回入站流水线；`$CLS_CASES` 对该消息的 triage-screen 题配 `p_yes: 0.90`，`$MODEL_CASES` 的 triage-draft 按脚本返回合法起草结果。'
    expected: 通过：该消息成为建议或转 needs_input，不拉起任务型（`apa run list` 没有新 Run），内容不进入任何带 unattended 的运行。失败：内容进入任务型或无人值守运行。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-FWD-08
    kind: business-action
    step: 本人重新委派开始新链路
    how: 在 Web 对该工作重新委派给 work-host.cli，用 WRK 读 context。
    expected: 通过：新子事项不带 unattended，WRK 可读全部消息。失败：仍带 unattended。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-FWD-09
    kind: business-action
    step: 默认为空且能力包不能改
    how: 全新环境查看白名单；再用能力包声明白名单字段并 `apa pack validate`；用 DEL 请求 `PATCH /v1/settings/allowlists`。
    expected: 通过：默认空；能力包被拒绝；DEL 被拒绝。失败：任一入口能改。
    requirement_ids:
    - REQ-G1-6
- id: flow-guideline-draft
  name: 有仓库却没有规范的项目会自动起草，由本人确认（替身版）
  actions:
  - id: ACT-DRF-01
    kind: business-action
    step: 本机有检出时任务型起草
    how: 用 `git init` 建本地仓库 DRAFT_REPO 并检出，新建 repos=[file://DRAFT_REPO]、无规范的项目 acc-draft；在 Web 把 guideline-draft 规则切 auto，检测周期改为 1 分钟；默认 harness 为 acc-stub，STUB_HARNESS 切到脚本：用运行凭据 `apa material commit <acc-draft 的规范> --from draft.md --kind guideline --reason 起草`。
    expected: 通过：拉起任务型，`apa material commit --kind guideline` 产生 proposed 修订，不自动生效。失败：未起草，或直接生效。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DRF-02
    kind: business-action
    step: 本机无检出时委派起草
    how: 新建只有远程地址（`https://example.invalid/acc/draft2.git`）、无本机检出的项目 acc-draft2，允许的执行者含 work-host.cli。
    expected: 通过：建委派子事项交执行者起草，受名单校验。失败：绕过名单。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DRF-03
    kind: business-action
    step: 确认后下一次同步写入
    how: 在 Web 确认起草修订，在检出运行 `apa agents sync`。
    expected: 通过：规范生效，AGENTS.md 写入工作区，且不产生提交。失败：未写入。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DRF-04
    kind: business-action
    step: 已有规范时不重复起草
    how: ACT-DRF-03 确认 acc-draft 的规范后，再等两个检测周期（周期为 1 分钟）；查看 Web 上 acc-draft 项目页的事项视图，并运行 `apa material list`，按项目 acc-draft 和 kind=guideline 筛选。
    expected: 通过：不再产生起草。失败：重复起草。
    requirement_ids:
    - REQ-G1-6
- id: flow-agents-md
  name: 规范一处修改，AGENTS.md 由账本渲染，漂移可检测（场景六，本地仓库版）
  actions:
  - id: ACT-AGM-01
    kind: business-action
    step: 规范生效要本人确认
    how: 运行 `APA_TOKEN=$DEL apa material commit <acc-work 的规范> --from g.md --reason 初版 --kind guideline`，再用 DEL 请求 `POST /v1/revisions/{id}/confirm`，然后在 Web 确认。
    expected: 通过：提交后是 proposed；DEL 确认被拒绝（退出码 20 语义）；Web 确认后生效，事件流有 guideline.activated。失败：agent 能使规范生效。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-02
    kind: business-action
    step: 渲染内容完整
    how: 请求 `GET /v1/agents-md?repo=LOCAL_REPO`。
    expected: 通过：依次含 managed 标记、来源修订 id、内容 hash、全局规范摘要、项目规范非空小节、本仓库托管文档的索引和固定指引；不是本仓库的托管文档不进索引；渲染 hash 已记入账本。失败：缺部分或顺序不对。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-03
    kind: business-action
    step: 写入工作区
    how: 在 LOCAL_REPO 的本机检出运行 `apa agents sync`，再运行 `git status` 和 `git log`。
    expected: 通过：写入 AGENTS.md，不提交，不推送；随后 `apa agents check` 退出码 0。失败：产生提交或推送。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-04
    kind: business-action
    step: 过期时退出码 10
    how: 在 Web 改规范并确认，然后 `apa agents check`；同一渲染 hash 下用两个新会话引用各运行一次 `APA_TOKEN=$DEL APA_SESSION=acc-session-2 apa context --format inject`（再换 acc-session-3）。
    expected: 通过：退出码 10；`apa agents sync` 可直接覆盖；同一仓库同一渲染 hash 只提示一次，已有未完成的同步子事项时不提示；Web 项目页显示状态。失败：反复提示，或无法覆盖。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-05
    kind: business-action
    step: 漂移时退出码 11，不覆盖
    how: 手改工作区 AGENTS.md，运行 `apa agents check` 和 `apa agents sync`。
    expected: 通过：check 退出码 11，生成 needs_input 附 diff，选项为合回、覆盖、本次忽略；sync 退出码 6，手改内容不丢。失败：手改内容被覆盖。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-06
    kind: business-action
    step: 合回
    how: 在 Web 对漂移事项选"合回"，再确认生成的修订，然后 `apa agents sync`。
    expected: 通过：diff 成为 Guideline 的 proposed 修订；确认后重新渲染；sync 后 check 退出码 0。失败：改动丢失。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-07
    kind: business-action
    step: 覆盖和忽略
    how: 再造两次漂移，分别选"覆盖"和"本次忽略"。
    expected: 通过：选覆盖后 sync 才写入；选忽略不写文件，事项关闭。失败：未选就覆盖。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-08
    kind: business-action
    step: 已有手写 AGENTS.md 的仓库首次检查
    how: 在已有手写 AGENTS.md 的另一仓库登记到 acc-work 后运行 `apa agents check`。
    expected: 通过：落入漂移流程，退出码 11，不覆盖。失败：直接覆盖。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-09
    kind: business-action
    step: 相关提交也触发检测
    how: 为 acc-work 登记代码托管来源（TOOL_STUB_BIN 的 case 设为 gh-agentsmd-changed：默认分支上一个修改 AGENTS.md 的提交事件），同时在 LOCAL_REPO 检出里提交对 AGENTS.md 的修改，等该来源一个周期。
    expected: 通过：触发同一检测，产生漂移事项。失败：未触发。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-AGM-10
    kind: business-action
    step: 规范不能放宽内核规则
    how: 在规范的"处理规则"写"资金类决策可代答"，生效后再对 web_only 决策运行 `apa decide`。
    expected: 通过：仍退出码 20。失败：内核规则被规范放宽。
    requirement_ids:
    - REQ-G1-6
- id: flow-material-hosted
  name: 代码仓库托管的设计文档只登记不复制，修改走委派（本地仓库版）
  actions:
  - id: ACT-HST-01
    kind: business-action
    step: 登记托管型材料
    how: 运行 `APA_TOKEN=$WRK apa material add --repo LOCAL_REPO --path docs/design.md`。
    expected: 通过：记录标题、kind、标签、仓库、路径和最近 commit；无 Revision；`apa material show` 只回位置。失败：存了正文副本。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-HST-02
    kind: business-action
    step: 托管型不能 commit
    how: 运行 `apa material commit <托管型 id> --from x.md --reason x`。
    expected: 通过：退出码 6，并提示其仓库路径。失败：写入成功。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-HST-03
    kind: business-action
    step: Web 只读展示默认分支内容
    how: 在 APA 主机的检出里留未提交的修改，再打开 Web 材料页。
    expected: 通过：展示默认分支内容并标明 commit，看不到未提交的修改；读取有 reader 类 Run。失败：显示工作区内容。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-HST-04
    kind: business-action
    step: 读不到时降级显示
    how: 把 LOCAL_REPO 目录与本机检出临时改名，使检出不存在、远程不可达，再打开该材料；之后改回。
    expected: 通过：只显示登记信息和"暂不可读"，页面不报错。失败：页面错误。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-HST-05
    kind: business-action
    step: 路径被删时修正登记
    how: 在默认分支删除 docs/design.md，经 `apa agents check` 或来源事件触发刷新。
    expected: 通过：生成 needs_input 修正登记，AGENTS.md 索引随之重新渲染。失败：一直显示旧路径。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-HST-06
    kind: business-action
    step: 发起修改走委派和 PR
    how: 在 Web 材料页发起修改，要求填写修改内容，assignee 选 work-host.cli；执行者在 LOCAL_REPO 开分支提交并合并回默认分支（本地仓库没有托管平台，以本地合并代替 PR 合并），然后 `APA_TOKEN=$WRK apa report <子事项> --outcome <完成> --pr https://example.invalid/pr/13`。
    expected: 通过：生成带 project、仓库、路径的子事项，并校验允许的执行者；合并后最近 commit 刷新，子事项 done。失败：能绕过名单，或 commit 未刷新。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-HST-07
    kind: business-action
    step: 托管型只索引元信息
    how: 运行 `apa material search <只出现在文档正文里的词>` 和 `apa material search <路径片段>`。
    expected: 通过：前者不命中，后者命中并回路径。失败：正文进入全文索引。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-HST-08
    kind: business-action
    step: 项目页集中查看
    how: 在 Web 打开 acc-work 项目页，依次查看事项、材料、规范三个视图，以及 repos 属性和允许的执行者。
    expected: 通过：只显示该项目的数据；材料视图把托管型和自有型并列并标明来源，托管型只读。失败：混入其他项目，或两型不可区分。
    requirement_ids:
    - REQ-G1-6
- id: flow-delegate-recover
  name: 主会话委派给执行者，回执自动回到原事项（场景三，替身版）
  actions:
  - id: ACT-DLG-01
    kind: flow-step
    step: 声明执行者
    how: 负责人：验收执行者。用 `apa declare <文件>` 提交本 harness 的 executors（work-host.cli，external-cli），确认前运行 `apa executors`；再到 Web 设置页确认。
    expected: 通过：确认前不在清单，确认后 `apa executors --project acc-work` 列出并标明允许。失败：未确认就生效。
  - id: ACT-DLG-02
    kind: business-action
    step: 建立委派子事项
    how: 在 acc-work 建父事项；以主会话 agent 的身份运行 `APA_TOKEN=$DEL apa delegate --parent <id> --assignee work-host.cli`。
    expected: 通过：子事项 assignee=work-host.cli、project=acc-work；父事项进入 waiting，waiting_on 指向执行者。失败：未建子事项，或父事项不是 waiting。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-03
    kind: business-action
    step: 执行者拿到项目上下文
    how: 用 WRK 运行 `apa context --scope item`（子事项 id）。
    expected: 通过：含项目信息、repos、相关材料标题和 AGENTS.md 指引，不含材料正文。失败：缺上下文或带出正文。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-04
    kind: business-action
    step: 执行者回执并附证据
    how: 运行 `APA_TOKEN=$WRK apa report <子事项> --outcome <完成> --summary 已修复 --pr <PR 链接>`（第一档，不带 `--evidence`，不需要 `APA_SESSION`）；再对另一个子事项不带任何结果证据运行 `--outcome <完成>`。
    expected: 通过：带 `--pr` 的回执使子事项 done 并带结果证据，父事项回 open，事件流有 delegation.reported；不带结果证据的完成回执退出码 2，子事项不变。失败：父事项未回 open，或无结果证据的完成回执生效。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-05
    kind: business-action
    step: 回收结果注入主会话
    how: ACT-DLG-04 回执完成后，用与 ACT-DLG-02 相同的会话引用运行 `APA_TOKEN=$DEL APA_SESSION=acc-session-1 apa context --format inject`。
    expected: 通过：输出含该子事项已完成及其 PR 证据。失败：不含回执结果。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-06
    kind: business-action
    step: 插件捕获回执
    how: 运行插件回执捕获的契约测试 `python3 -m pytest -q plugins/hermes/tests/receipt/`：覆盖执行者工具调用参数带子事项 id 且执行者不自行回执、以及不带事项 id 的调用两种情况。
    expected: 通过：测试全部通过；第一种写入回执（对模型无可见输出），第二种不产生任何回执。失败：漏捕或误捕。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-07
    kind: business-action
    step: 其他凭据不能回执
    how: 用 WRK2 对 assignee=work-host.cli 的子事项运行 `apa report`。
    expected: 通过：退出码 4，子事项不变。失败：回执生效。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-08
    kind: business-action
    step: 全部子事项终态后父事项才回 open
    how: 父事项建两个子事项。一个 `apa report --outcome <完成> --pr <PR 链接>`；另一个 `apa ask` 进 needs_input，看父事项；再把它转 dropped，看父事项。
    expected: 通过：一个 done 一个 needs_input 时父事项仍是 waiting；两者都到终态后回 open。失败：提前回 open，或不回。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-09
    kind: business-action
    step: 回执阻塞
    how: 运行 `APA_TOKEN=$WRK apa report <子事项> --outcome <阻塞> --summary 本机无检出`。
    expected: 通过：进展和阻塞原因可查，父事项仍是 waiting，事项不丢失。失败：回执被丢弃。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-DLG-10
    kind: business-action
    step: Web 查看和改派
    how: 打开 Web 任务委派页查看子事项，再把它改派给 acc-work 名单内的另一执行者（先把该执行者加入名单）。
    expected: 通过：能看到谁在干、干到哪、证据和跟进状态；改派后 assignee 更新且有 Event。失败：信息缺失。
    requirement_ids:
    - REQ-G1-6
- id: flow-brief
  name: 简报按周期生成并送达，同一周期只有一份（场景五，替身版）
  actions:
  - id: ACT-BRF-01
    kind: business-action
    step: 到期生成简报
    how: 默认 harness 为 acc-stub，STUB_HARNESS 切到"简报"脚本：用运行凭据把按项目分节的正文写回目标事项后回执。运行 `APA_TOKEN=$DEL apa instance add brief --param schedule="* * * * *"`，等待 2 分钟后运行 `apa item list`（kind=brief）。
    expected: 通过：事项先建好，然后 task 型 Run 经 STUB_HARNESS 写回；正文按项目分节；Web 简报页可见。失败：事项为空，或未分节。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BRF-02
    kind: business-action
    step: 简报送达
    how: 用新会话引用运行 `APA_TOKEN=$DEL APA_SESSION=acc-session-9 apa context --format inject`，查看 Web 未读，并让 CHAN_EXT 领取。
    expected: 通过：会话开始注入带上简报摘要；未注入、未领取时留在 Web 未读。失败：三者都没有。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BRF-03
    kind: business-action
    step: 同一周期只生成一份
    how: 保持每分钟的实例运行 5 分钟，用 `apa item list` 按周期统计 kind=brief 的事项数。
    expected: 通过：每个周期至多一份。失败：同一周期出现两份。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BRF-04
    kind: business-action
    step: 停机后只补最近一次
    how: 停 `apa serve` 5 分钟后重启，等待 1 分钟。
    expected: 通过：只补一份最近周期的简报。失败：补出多份。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BRF-05
    kind: business-action
    step: 用生成型覆盖模板
    how: '在 $APA_HOME/packs/brief 把提示词模板 front matter 改为 `agent: generate`，并在 harness 不可用时触发。'
    expected: 通过：简报由生成型产出，无需无头运行。失败：仍要求无头运行。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-BRF-06
    kind: business-action
    step: 周期复盘
    how: 运行 `apa instance add review --param schedule="* * * * *"`，等待 2 分钟。
    expected: 通过：生成复盘，写回 brief kind，由 spec.period 区分周期。失败：未生成，或无法区分。
    requirement_ids:
    - REQ-G1-6
- id: flow-channel-telegram
  name: 提醒经随包即时通讯渠道 ext 送达，本人回复后事项继续，不依赖任何 harness（场景八，机器人替身版）
  actions:
  - id: ACT-TG-01
    kind: flow-step
    step: 启动 渠道 渠道 ext
    how: 负责人：验收执行者，依赖 ACT-ENV-07。停用宿主插件，不启动 STUB_HARNESS。运行 `apa ext list`，用 CHAN 和 `apa ext run <即时通讯渠道 ext 名>` 启动 CHAN_EXT 并连接机器人替身 fakebot。在 Web 设置回答人白名单为替身账号 acc-user。
    expected: 通过：ext 进程运行，不依赖任何 harness。失败：缺宿主时启动失败。
  - id: ACT-TG-02
    kind: business-action
    step: 决策请求送达 渠道
    how: 用 `apa ask` 提交普通决策（两个选项和一个推荐），打扰策略路由到该渠道。
    expected: 通过：机器人替身记录到发给 acc-user 的一条消息，含问题、选项、推荐；投递 state=delivered，记 external_ref。失败：未发出，或没有 ref。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-TG-03
    kind: business-action
    step: 在 渠道 回答
    how: 在机器人替身里以 acc-user 回复选项。
    expected: 通过：事项继续，resolved_via=<渠道名>，回答人已记录，`apa why` 可查。失败：回答未回流。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-TG-04
    kind: business-action
    step: web_only 只给 Web 链接
    how: 提交 tag=acc-finance 的决策，再在机器人替身里以 acc-user 回复"同意"。
    expected: 通过：消息只带 Web 链接，不发表单链接；回复被拒绝并返回 Web 链接；事项仍是 needs_input。失败：决策生效。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-TG-05
    kind: business-action
    step: ext 不用 harness 网关
    how: 运行 `go list -deps ./ext/telegram/...` 查看 ext 的依赖，并运行 `go run ./tools/redline`。
    expected: 通过：依赖里没有 plugins/ 下任何包，红线检查通过。失败：依赖 harness 代码。
    requirement_ids:
    - REQ-G1-6
  - id: ACT-TG-06
    kind: business-action
    step: ext 崩溃重启后不重复发送
    how: ext 发送后、回报 ack 前 `kill -9`，然后重启。
    expected: 通过：租约过期后重新领取，以投递 id 为幂等键，机器人替身对该投递只记录一条消息。失败：重复发送。
    requirement_ids:
    - REQ-G1-6
