    - REQ-G1-2
- id: flow-allowed-executors
  name: 项目限定的执行者是内核硬约束，任何入口都绕不过去
  actions:
  - id: ACT-ALW-01
    kind: business-action
    step: 委派给名单外执行者返回 21
    how: 在 acc-work 建父事项，运行 `APA_TOKEN=$DEL apa delegate --parent <id> --assignee other-host.cli`。
    expected: 通过：退出码 21，输出含 allowed=[work-host.cli] 和 next；没有新子事项；父事项不变；有一条 command.rejected。失败：子事项被建，或没有拒绝记录。
