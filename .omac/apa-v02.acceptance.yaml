    - REQ-G1-2
  - id: ACT-ALW-06
    kind: business-action
    step: 不能先建后移入项目
    how: 建无项目、assignee=other-host.cli 的事项，再 `apa item update` 把 project 改为 acc-work。
    expected: 通过：退出码 21，project 不变。失败：移入成功。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ALW-07
    kind: business-action
    step: 子事项不能换项目
    how: 在 acc-work 委派子事项时指定 project=acc-open；再对已建子事项 `apa item update` 改 project=acc-open。
    expected: 通过：两次都被拒绝，子事项仍属 acc-work。失败：子事项被移到别的项目。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ALW-08
    kind: business-action
    step: 只在 Web 改名单
    how: 运行 `APA_TOKEN=$DEL apa project update acc-work`，请求里带 allowed_executors；再 `PATCH /v1/projects/{id}` 带同样字段。
    expected: 通过：CLI 退出码 20，API 403，名单不变。Web 修改后有 project.allowed_executors_changed。失败：非 Web 入口改写成功。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ALW-09
    kind: business-action
    step: 规则动作也校验
    how: 用户能力包里写一条 `create_item` 规则，指定 project=acc-work、assignee=other-host.cli，切到 auto 后触发。
    expected: 通过：不建事项，有拒绝事件。失败：规则绕过了名单。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ALW-10
