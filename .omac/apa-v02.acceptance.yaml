    how: 用 `apa project repos add` 给 acc-work 登记检出 /tmp/acc/repo（机器名为本机主机名），给 acc-open 登记检出 /tmp/acc/repo/sub。在 /tmp/acc/repo/sub/x 运行 `apa context --scope cwd`。
    expected: 通过：作用域是 acc-open（最长前缀）；`GET /v1/projects/resolve?path&host` 结果一致。失败：选错项目。
