    how: 把 acc-work 的事项用 `apa item update` 改 assignee=other-host.cli；再在 Web 任务委派页做同样操作。
    expected: 通过：CLI 退出码 21；Web 同样拒绝并提示原因；assignee 不变。失败：任一入口改写成功。
