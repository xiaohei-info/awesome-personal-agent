  - id: ACT-GATE-08
    kind: business-action
    step: SPIKE-ROUTINE 的 create_item 部分有结论并写回 §13.5 与附录 C.7
    how: 打开主文档 §13.5、附录 C.7 与 §21.3 的 `SPIKE-ROUTINE` 行，对照 flow-routine 的执行结果。
    expected: 通过：写明 `create_item` 模式可加载并运行、`instruction_path` 文件写入已用 STUB_HARNESS 证实，并说明 routine 包是纯能力包还是需要小改内核；`run` 模式在真实宿主可读注明由 L12 承接。失败：没有写回。
    requirement_ids:
    - REQ-G3-1
  - id: ACT-GATE-09
    kind: business-action
    step: SPIKE-WEB-MOBILE 有结论并写回 §4.1
    how: 打开主文档 §4.1 与 §21.3 的 `SPIKE-WEB-MOBILE` 行，对照 flow-web-workbench 的 360 像素走查结果。
    expected: 通过：§4.1 写明各页面在 360 像素宽度下可读可操作的结论（或已修正的页面）；§21.3 该行标为已关闭。失败：没有结论。
    requirement_ids:
    - REQ-G3-1
  - id: ACT-GATE-10
    kind: business-action
    step: SPIKE-DONE-AUTHZ 有结论并写回 §14.5
    how: 打开主文档 §14.5 与 §21.3 的 `SPIKE-DONE-AUTHZ` 行，对照 flow-authz-matrix 中对应用例的结果。
    expected: 通过：§14.5 写明 delegate 凭据把本人事项标为完成需要本人原话或授权单已证实（或不成立时已修实现并复验）。失败：没有结论。
    requirement_ids:
    - REQ-G3-1
  - id: ACT-GATE-11
    kind: business-action
    step: ACT-BKL 的流程部分有结论并写回 §8.9
    how: 打开主文档 §8.9 与 §21.3 的 `ACT-BKL` 行，对照 flow-backlog-release 的执行结果。
    expected: 通过：§8.9 写明放开四步与每日上限已在合成夹具上用替身验收；不确定带起始值（0.15 / 0.60）与带内占比注明由 L5 在真实积压上得出，未在开发验收中下结论。失败：没有写回，或把起始值写成已校准。
    requirement_ids:
    - REQ-G3-1
  - id: ACT-GATE-12
    kind: business-action
    step: §21.3 没有遗漏的开发验收条目
    how: 逐行阅读主文档 §21.3，把"由谁证实"含开发验收的条目与 ACT-GATE-04 至 ACT-GATE-11 对照。
    expected: 通过：每个开发验收条目都在上面有对应且已关闭；只由本机升级验证证实的条目（SPIKE-STRUCT、MEAS-HOST-CTX 等）注明 L 编号，不计入门槛 3。失败：有开发验收条目没有结论。
    requirement_ids:
    - REQ-G3-1
  - id: ACT-GATE-13
    kind: business-action
    step: 缺陷账本没有未关闭且无人负责的条目
    how: 运行只读命令 `omac defect list <本轮 manifest> --output json`，以及对 v0.1 账本 `omac defect list .omac/apa.yaml --output json`。
    expected: '通过：两份结果里都没有 `state: needs-owner` 的条目；其余未关闭的条目都有负责的修复节点或负责人（本人）。失败：存在未关闭且无负责方的条目。'
    requirement_ids:
    - REQ-G4-1
  - id: ACT-GATE-14
    kind: business-action
    step: 四条遗留缺陷各自据替身复验关闭，或转本人
    how: 在 ACT-GATE-13 的结果里核对：`dfx-5dd4c0c9998f`（锚点 flow-source-calendar/ACT-CAL-03）、`dfx-1699a21c5f70`（ACT-CAL-02）、`dfx-5410a4c832ad`（flow-wake-lease/ACT-WAK-01、ACT-WAK-04）、`dfx-80defa39c0dd`（flow-hermes-context/ACT-HCTX-09），并对照本文这些锚点的执行结果。
    expected: 通过：每条要么已关闭且关闭说明引用本文对应锚点的通过结果，并写明"真实环境复核由本机升级验证 L11（日历两条）/ L9（唤醒与插件上下文）承接"；要么替身无法复现，已指派给本人并标"转本机验证"。失败：任一条仍为 needs-owner，或未经复验就关闭。
    requirement_ids:
    - REQ-G4-1
  - id: ACT-GATE-15
    kind: business-action
    step: 修复节点已放弃的"已修复"缺陷经核实
    how: '在 v0.1 账本里找出 `state: fixed` 而 `fix_node` 在 `.omac/apa.state` 中状态为 `abandoned` 的条目（至少含 `dfx-27e69d9e5716`，fix_node `fix.hermes-plugin-headless.27e69d`，以及回执相关的一条），逐条核对修复是否经别的节点合入、锚点在本文或基线中是否通过。'
    expected: 通过：每条都有记录写明修复所在的合并提交或 PR 与通过的锚点；找不到的已重新登记为未关闭缺陷并有负责方。失败：存在"已修复"但修复与验证都无据可查的条目。
    requirement_ids:
    - REQ-G4-1
  - id: ACT-GATE-16
    kind: flow-step
    step: 交付说明列出本机升级验证清单
    how: 负责人：验收执行者。时机：门槛 1、3、4 判定之后。在本轮交付说明里原样列出主文档 §20.4 的本机升级验证清单 L1–L12（编号、验证什么、通过标准），注明由本人在开发完成后执行，本轮不验、不作为发布收尾的依赖；并列出转给本人的缺陷与实测项对应的 L 编号。
    expected: 通过：交付说明含完整的 L1–L12 与对应关系。失败：清单缺项，或把 L 项写成已通过。
- id: flow-bootstrap
  name: 本人从零安装、启动并登录 APA，agent 不读文档也能上手
  actions:
  - id: ACT-BOOT-01
    kind: business-action
    step: 初始化数据目录
    how: 在空目录上运行 `APA_HOME=<空目录> apa init`，按提示设置 Web 登录口令（不少于 12 个字符）。
    expected: 通过：目录下出现 config.yaml、ledger.db、blobs/、packs/、sources/、runs/、logs/，退出码 0。失败：缺少任一项，或数据写到 APA_HOME 之外。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-BOOT-02
    kind: business-action
    step: 启动服务并默认只监听本机
    how: 运行 `apa serve`，再用 `lsof -iTCP -sTCP:LISTEN -a -p <pid>` 查看监听地址。
    expected: 通过：只监听回环地址，Web 首页可打开。失败：默认监听 0.0.0.0 或其他外部地址。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-BOOT-03
    kind: business-action
    step: Web 登录成为本人
    how: 在 Web 登录页先输入错误口令，再输入 `apa init` 设置的正确口令。
    expected: 通过：错误口令被拒绝且看不到任何账本数据；正确口令进入工作台，能看到决策待办、建议流、事项、项目、设置等页面。失败：错误口令可进入，或页面缺失。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-BOOT-04
    kind: business-action
    step: 签发 token，明文只显示一次
    how: 在 Web 设置页签发一个 observer token，记下明文；刷新页面重新查看；再运行 `grep -rl <明文> $APA_HOME`。
    expected: 通过：明文只在签发时显示一次，刷新后看不到；grep 在数据目录内无匹配。失败：明文可再次查看，或出现在 ledger.db、WAL、logs 中。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-BOOT-05
    kind: business-action
    step: agent 经 CLI 自助上手
    how: 运行 `apa login`（填 APA 地址和 observer token），再运行 `apa guide` 和 `apa guide --template`。先在账本里建一条标题含 MARKER-USER-CONTENT 的事项。
    expected: 通过：`apa guide` 无需 token 也能输出，说明命令和退出码含义；`--template` 约 600 token 内，声明事项正文是资料、账本是唯一真理源、委派前先 `apa delegate`；两者都不含 MARKER-USER-CONTENT。失败：需要 token、缺少这些声明，或带出用户内容。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-BOOT-06
    kind: business-action
    step: 凭据失效时返回退出码 3
    how: 运行 `APA_TOKEN=invalid apa inbox`。
    expected: 通过：退出码 3，输出为 JSON，含 code、why、next。失败：其他退出码或返回账本数据。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-BOOT-07
    kind: business-action
    step: 内核不可达时返回退出码 7
    how: 停止 `apa serve` 后运行 `APA_TOKEN=$OBS apa inbox`，然后重新启动服务。
    expected: 通过：退出码 7；重启后同一命令退出码 0，且停机前的数据还在。失败：其他退出码、CLI 挂起超过 30 秒，或重启后数据丢失。
    requirement_ids:
    - REQ-G1-2
- id: flow-item-lifecycle
  name: 本人和 agent 经两个入口操作同一事项，阶段约束由内核强制
  actions:
  - id: ACT-ITEM-01
    kind: business-action
    step: CLI 建的事项在 Web 可见
    how: '`APA_TOKEN=$DEL apa item add` 新建 kind=task、标题 item-a、project=acc-open 的事项，附证据文本；在 Web 事项页打开它。'
    expected: 通过：Web 显示 item-a、阶段 open 和 agent 操作者徽章，时间线有一条创建记录。失败：Web 看不到，或操作者不是 agent。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-02
    kind: business-action
    step: Web 的修改在 CLI 可见
    how: 在 Web 把 item-a 的 status_label 改为 review，再运行 `APA_TOKEN=$OBS apa item show <id>`。
    expected: 通过：CLI 输出 status_label=review、version 加一，Event 的 actor 为本人且 via=web。失败：两端状态不一致。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-03
    kind: business-action
    step: waiting 必须有 waiting_on
    how: '`APA_TOKEN=$DEL apa item transition <id>` 转 waiting，不提供 waiting_on；再提供 waiting_on={external, 报价单} 重试。'
    expected: 通过：第一次非 0 且阶段不变，错误体含 code、why、next；第二次成功。失败：无 waiting_on 也能进入 waiting。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-04
    kind: business-action
    step: needs_input 必须有 ask
    how: '`apa item transition` 把事项转 needs_input，不写 ask。'
    expected: 通过：非 0，阶段不变。失败：出现没有 ask 的 needs_input 事项。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-05
    kind: business-action
    step: dropped 必须有 reason
    how: '`apa item transition` 把事项转 dropped，不带 reason；再带 reason 重试。'
    expected: 通过：第一次非 0 且阶段不变；第二次成功，事项仍可查询且未被删除。失败：无 reason 可进入 dropped，或事项被删除。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-06
    kind: business-action
    step: delegation 进 done 必须带证据
    how: 新建 kind=delegation 的事项，用 `apa item transition` 转 done，不带证据；再用 `apa report --outcome <完成> --pr <PR 链接>`。
    expected: 通过：无证据时非 0 且阶段不变；带证据后进入 done。失败：无证据可完成。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-07
    kind: business-action
    step: 终态可以重开
    how: 把一个 done 事项和一个 dropped 事项分别用 `apa item transition` 转回 open，附 reason。
    expected: 通过：两者都回到 open，各记一条带 reason 的 Event。失败：不能重开，或没有 Event。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-08
    kind: business-action
    step: 并发修改由版本号裁决
    how: 读取事项 version=N，同时发两次带 version=N 的 `PATCH /v1/items/{id}`，内容不同。
    expected: 通过：恰好一次成功，另一次 HTTP 409（CLI 退出码 6），事项只反映成功的那次。失败：两次都成功，或后写覆盖前写。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-09
    kind: business-action
    step: 幂等键防止重复写入
    how: 用同一个幂等键连续两次 `POST /v1/items`。
    expected: 通过：两次返回同一事项 id，账本只多一个事项和一条 item.created。失败：产生两个事项。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-10
    kind: business-action
    step: 调用方不能写内核维护的字段
    how: 用 DEL 经 `PATCH /v1/items/{id}` 提交 chain_depth=99、unattended=true、ask.risk_class=none。
    expected: 通过：无论请求被拒绝还是字段被忽略，`apa item show` 里这些字段都不变。失败：任一字段被改写。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-11
    kind: business-action
    step: 按 kind 校验 spec，ext 原样透传
    how: brief 包加载后，用不符合 schema 的 spec 建 kind=brief 事项；再建 kind=acc-unregistered、spec 任意的事项，并写 ext.github.pr=88。
    expected: 通过：前者被拒绝；后者成功，`apa item show` 原样返回 spec 和 ext，Web 也原样展示。失败：校验未生效，或未注册 kind 被拒绝，或内容被改写。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-12
    kind: business-action
    step: 关联事项并按标签筛选
    how: '`apa item relate` 在两个事项间建 relates 边；给一个事项加两个 tag；在 Web 事项页按 tag 筛选。'
    expected: 通过：`apa item show` 能看到关系，筛选结果正确。失败：关系丢失或筛选不生效。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-ITEM-13
    kind: business-action
    step: 读取不存在的对象返回退出码 5
    how: 运行 `APA_TOKEN=$OBS apa item show item_not_exist`。
    expected: 通过：退出码 5。失败：其他退出码或返回空对象。
    requirement_ids:
    - REQ-G1-2
- id: flow-web-only
  name: 高风险决策只能由本人在 Web 确认，agent 无法绕过
  actions:
  - id: ACT-WEB-01
    kind: flow-step
    step: 配置高风险策略
    how: 负责人：验收执行者。时机：flow-web-only 的第一步，flow-env-baseline 全部完成之后、ACT-WEB-02 之前。在 Web 设置页确认默认类别含资金、对外承诺、不可逆、权限变更、规范生效，并新增规则 tag=acc-finance 归入资金类。
    expected: 通过：策略生成新版本，事件流有 policy.changed。失败：默认类别缺失，或变更无记录。
  - id: ACT-WEB-02
    kind: business-action
    step: CLI 代答 web_only 决策返回 20
    how: 建 tag=acc-finance 的事项，`apa ask` 写入决策请求，再运行 `APA_SESSION=<会话引用> APA_TOKEN=$DEL apa decide <id> --option A --evidence "同意"`。
    expected: 通过：退出码 20，输出含结构化说明和 Web 链接；事项停在 needs_input，risk_class 为资金类。失败：决策生效，或没有 Web 链接。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-WEB-03
    kind: business-action
    step: 接受 web_only 建议同样返回 20
    how: 用 `apa propose` 建 tag=acc-finance 的建议，运行 `APA_SESSION=<会话引用> APA_TOKEN=$DEL apa accept <id> --evidence "同意"`。
    expected: 通过：退出码 20，阶段仍为 proposed。失败：建议被接受。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-WEB-04
    kind: business-action
    step: 创建者不能降低门槛
    how: 建 tag=acc-finance 的事项时在 `apa ask` 或 `POST /v1/items/{id}/ask` 中附 risk_class=none。
    expected: 通过：`apa item show` 显示 risk_class 仍为资金类，代答仍返回 20。失败：门槛被降低。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-WEB-05
    kind: business-action
    step: web_only 不允许超时默认值
    how: 对 tag=acc-finance 的事项提交带 default_on_timeout 的决策请求。
    expected: 通过：请求被拒绝，或默认值被清除；到截止时间事项仍是 needs_input，不会自动决定。失败：到期后被自动决定。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-WEB-06
    kind: business-action
    step: 本人在 Web 确认
    how: 在 Web 决策待办回答 ACT-WEB-02 的事项。
    expected: 通过：resolved_via=web，事项按选项前进。失败：Web 也无法完成。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-WEB-07
    kind: business-action
    step: 被拒绝的命令可追溯
    how: 运行 `APA_TOKEN=$OBS apa why <ACT-WEB-02 的事项 id>`，再在审计页筛选 command.rejected。
    expected: 通过：能看到退出码 20 对应的拒绝记录和发起凭据。失败：拒绝没有留痕。
    requirement_ids:
    - REQ-G1-2
- id: flow-decision-timeout
  name: 决策超时按默认值决定，没有默认值就继续等本人
  actions:
  - id: ACT-TMO-01
    kind: business-action
    step: 到期按默认值决定
    how: 用 `apa ask` 提交普通决策请求，deadline=当前时间加 1 分钟，default_on_timeout=A。等待 2 分钟后运行 `apa item show <id>`。
    expected: 通过：resolution=A、resolved_via=timeout，Event 的 actor 为 system 且 via=clock。失败：未决定，或 actor 不是 system。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-TMO-02
    kind: business-action
    step: 无默认值时保持等待并再提醒
    how: 提交 deadline=当前时间加 1 分钟、无默认值的决策请求，打扰策略设为到期再提醒。等待 2 分钟后查看事项和 Web 未读。
    expected: 通过：事项保持 needs_input，并产生一条再提醒。失败：事项被自动决定或丢弃，或没有再提醒。
    requirement_ids:
    - REQ-G1-2
- id: flow-agent-revert
  name: 本人能看到 agent 做了什么，并在 Web 一键撤销
  actions:
  - id: ACT-REV-01
    kind: business-action
    step: 查看 agent 变更视图
    how: 用 DEL 附证据修改一个事项标题，再代答一个决策；打开 Web 的"agent 变更"视图。
    expected: 通过：两条都在，自上次访问以来的范围正确，带操作者和证据。失败：缺记录。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-REV-02
    kind: business-action
    step: 一键撤销写反向命令
    how: 在该视图撤销那次标题修改。
    expected: 通过：标题恢复，时间线多一条撤销 Event，原 Event 仍在；界面提示外部已发生的副作用不会被撤销。失败：历史被改写，或没有提示。
    requirement_ids:
