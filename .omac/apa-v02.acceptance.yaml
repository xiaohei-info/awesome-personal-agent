    expected: 通过：在途子事项继续且回执有效，有一条通知；再次委派返回 21。失败：在途工作被撤销，或再次委派成功。
    requirement_ids:
    - REQ-G1-2
- id: flow-command-registration
  name: 可执行命令只有本人能登记，agent 不能借此在主机上执行任意命令
  actions:
  - id: ACT-CMD-01
    kind: business-action
    step: delegate 不能登记自定义命令
    how: 运行 `APA_TOKEN=$DEL apa source add`，请求带自定义命令 /tmp/acc/evil.sh；再 `POST /v1/sources` 带同样字段。
    expected: 通过：CLI 退出码 20，API 403；/tmp/acc/evil.sh 从未执行（脚本写标记文件可证实）。失败：来源被登记或脚本被执行。
