    how: 在 acc-work 的检出目录内运行 `apa context --project acc-open`，再设 `APA_PROJECT=acc-open` 运行 `apa context --scope cwd`。
    expected: 通过：两次作用域都是 acc-open。失败：被当前目录覆盖。
