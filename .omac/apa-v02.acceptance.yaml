    - REQ-G1-2
- id: flow-ledger-integrity
  name: 账本不变量和架构红线从第一个里程碑起就由测试和 CI 守住
  actions:
  - id: ACT-LED-01
    kind: business-action
    step: 由 Event 重建投影结果一致
    how: 运行仓库测试 `go test ./kernel/...` 中的投影重建用例（§6.7、§20.1 M1）：执行覆盖事项、项目、决策的一组命令后，从 Event 折叠重建投影，与现有投影逐字段比较。
    expected: 通过：用例存在且全绿，比较覆盖 Item、Project 和决策请求的全部字段。失败：不存在该用例，或有字段不一致。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-LED-02
    kind: business-action
    step: 变更和 Event 同事务提交
    how: 运行 `go test ./kernel/...` 中的不变量用例，并做一次强杀实验：循环写事项时 `kill -9 apa serve`，重启后对比每个事项的 version 和它的 Event 数量。
    expected: 通过：没有投影变更缺 Event，也没有 Event 缺投影。失败：两者不一致。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-LED-03
    kind: business-action
    step: §6.14 不变量都有测试
    how: 运行 `go test ./kernel/...`，逐条对照 §6.14 的 10 条不变量查找对应用例。
    expected: 通过：10 条都有测试，后续里程碑实现的条目在交付时补齐，全部通过。失败：有不变量没有测试。
    requirement_ids:
    - REQ-G1-2
  - id: ACT-LED-04
    kind: business-action
    step: 红线检查进 CI 且能拦下违规
    how: 在临时分支上做三处违规：外呼调用器之外的内核代码 import 网络库；内核代码出现 hermes 字样；packs/ 下出现 hermes 字样。运行仓库的红线检查（AGENTS.md"红线检查"，随 M1 进 CI），之后撤销改动。
    expected: 通过：干净代码上检查通过；三处违规各自使检查失败并指出位置；CI 配置中包含这一步。失败：有违规未被发现，或检查不在 CI 中。
    requirement_ids:
    - REQ-G1-2
- id: flow-project-mapping
  name: 当前目录按明确规则映射到项目，不猜
  actions:
