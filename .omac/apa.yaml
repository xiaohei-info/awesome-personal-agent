  title: Hermes 与工具实测结论写回
  description: 产出 docs-measured-results-doc。负责 1 个 business-action（flow-release）。要点：按稳定
    ID 在两处写结论表，行格式 `| MEAS-<ID> | 成立/不成立/有条件成立 | 说明与实测版本 |`。附录 A：ALL-HOOKS（无头钩子是否触发）、ALL-INJECT（注入是否被判提示注入）、ALL-CRED（运行凭据能否到达
    CLI）、HERMES-PREHOOK（注入消息是否触发消息前钩子）、HERMES-WAKETOOL（唤醒回合工具包装）、HERMES-COMPACT（无通用压缩前入口）、HERMES-TOKEN（terminal
    是否保留 APA_TOKEN），并按实测修正 A.2 示例的工具集占位。主文档 §9.7（配套文件，同次改动）：MAIL-SEEN（读正文是否改已读）、MAIL-MSGID（JSON
    是否带 Message-ID）、MAIL-AUTH（认证失败可否识别）、CAL-INCR（增量查询方式）、CAL-IDS（JSON 是否带 UID、RECURRENCE-ID、更新时间）、CAL-RECUR（重复事件展开）、CAL-AUTH（认证失败可否识别）。三条命令在基线都失败。
    派给 omac-worker-frontend 是因为它运行在 Mac mini 上，该主机有真实 Hermes 和 ego-browser。
  reviewer: omac-reviewer
  contract:
    objective: §21.3 的"全部"和 Hermes 两行、§9.7 首版工具的实测项都有结论，并写回附录 A 与 §9.7
    non_goals:
    - 未实测的项不得写结论，检查保持失败并用 `omac work block` 上报
    - 不写本机路径、账号和机器名
    - 不改 Hermes 以外 harness 的"需实测"条目
    verification_commands:
    - '( for id in ALL-HOOKS ALL-INJECT ALL-CRED HERMES-PREHOOK HERMES-WAKETOOL HERMES-COMPACT
      HERMES-TOKEN; do grep -Eq "^\| *MEAS-$id *\| *(成立|不成立|有条件成立) *\| *[^| ]" docs/appendix-a-harness.md
      || { echo "appendix-a missing conclusion: MEAS-$id"; exit 1; }; done )'
    - '( for id in MAIL-SEEN MAIL-MSGID MAIL-AUTH CAL-INCR CAL-IDS CAL-RECUR CAL-AUTH;
      do grep -Eq "^\| *MEAS-$id *\| *(成立|不成立|有条件成立) *\| *[^| ]" docs/solution-design.md
      || { echo "section 9.7 missing conclusion: MEAS-$id"; exit 1; }; done )'
    - '! grep -Eq ''<只读工具集>|<可写工具集>|示例（字段示意，标志和工具集需按版本实测）'' docs/appendix-a-harness.md'
    integration_gates:
    - name: docs-measured-results-gate
      layer: L3
      source_of_truth:
      - docs/solution-design.md#213-需实测的-harness-行为
      - docs/solution-design.md#97-工具适配邮件与日历
      - docs/appendix-a-harness.md#a2-无头运行声明
