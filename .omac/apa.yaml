- id: repo-ci-redline
  worker: omac-worker-backend
  blocked_by: []
  title: Go 模块、CI 与架构红线检查
  description: 产出 repo-ci-redline-tooling。负责 1 个 business-action（flow-ledger-integrity）。要点：模块路径
    github.com/xiaohei-info/awesome-personal-agent；扫描内核 import 与标识符时排除自身模块路径前缀；外呼调用器固定为
    kernel/outcall/**；CI 跑 go build、go test ./...、redline。
  reviewer: omac-reviewer
  contract:
    objective: 仓库具备可构建的 Go 模块、CI 工作流和能拦下违规的红线检查 `go run ./tools/redline`
    non_goals:
    - 不实现任何业务模块
    - 红线检查只扫描边界，不校验业务规则
    verification_commands:
    - go build ./...
    - go test -count=1 ./tools/redline/...
    - go run ./tools/redline
    integration_gates:
    - name: repo-ci-redline-gate
      layer: L1
      source_of_truth:
      - AGENTS.md#红线检查
      - AGENTS.md#内核边界
      - docs/solution-design.md#54-依赖规则
      - docs/solution-design.md#18-技术选型
      delivery_goal: 仓库具备可构建的 Go 模块、CI 工作流和能拦下违规的红线检查 `go run ./tools/redline`
      covers:
