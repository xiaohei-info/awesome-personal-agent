- id: kernel-policy
  worker: omac-worker-backend
  blocked_by:
  - kernel-domain
  - kernel-store
  - kernel-eventlog
  title: 策略、人格与白名单配置
  description: 产出 kernel-policy-module。要点：人格约束：不超过约 400 token，超限拒绝保存；默认类别含资金、对外承诺、不可逆、权限变更、规范生效；权限上限默认
    read；白名单默认空。
  reviewer: omac-reviewer
  contract:
    objective: 策略版本、web_only 分类规则、打扰策略、材料写入策略、权限上限、模型端点、人格和两份白名单有唯一写入模块，每次变更产生新版本并记
      policy.changed
    non_goals:
