      - A.2 声明示例标志修正
      acceptance_refs:
      - flow-release
      commands:
      - '( for id in ALL-HOOKS ALL-INJECT ALL-CRED HERMES-PREHOOK HERMES-WAKETOOL
        HERMES-COMPACT HERMES-TOKEN; do grep -Eq "^\| *MEAS-$id *\| *(成立|不成立|有条件成立)
        *\| *[^| ]" docs/appendix-a-harness.md || { echo "appendix-a missing conclusion:
        MEAS-$id"; exit 1; }; done )'
      - '( for id in MAIL-SEEN MAIL-MSGID MAIL-AUTH CAL-INCR CAL-IDS CAL-RECUR CAL-AUTH;
