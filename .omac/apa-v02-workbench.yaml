- id: extract-align
  worker: omac-worker-backend-oracle
  blocked_by: []
  title: 抽取与起草对齐：共用清单、同组字段与 refs、候选走合并路径、prescreen none
  description: '产出 extract-align-delivery。入站流水线主文件按 extract-align → urgent-notify
    → material-budget 依次修改，本节点最先。模型只能从清单选：清单外 project 不归项目、清单外 attach_to 使推荐作废而候选保留，都不报错；只给
    title/kind/summary 的旧输出仍被接受；对话候选捕获始终预筛。名为 none 的用户模板与 then 非 extract 的 prescreen:
    none 加载被拒；notify_urgent 的加载校验在 urgent-notify。'
  reviewer: omac-reviewer
  contract:
    objective: '预筛、起草、抽取共用一份有界清单（活动项目与至多 100 条按相关度排序的未关闭事项，截掉时写明总数，按外发范围过滤），抽取候选与起草同一组字段并加
      refs，候选走合并路径（合并键取规范化标题加发送者、一条事件至多 20 条），支持 prescreen: none 与对应加载校验，内置模板同步更新'
    non_goals:
    - 不做紧急判断与提醒（urgent-notify）、资料预算裁剪（material-budget）
