nodes:
- id: schema-v8
  worker: omac-worker-backend
  blocked_by: []
  title: 账本结构版本 8：本迭代全部表与列一次迁移
  description: 产出 schema-v8-delivery。关键路径第一个节点，必须最先合入。合入前对照 changes-v0.2.0 §10.1 WB-01–WB-08
    逐条核：来源原文表、来源事件两列（完整程度默认 legacy）、Event 两列、事项导入信息列与 origin 非唯一表达式索引、导入批次与对照两表、材料形态与位置两列（链接型（项目，位置）唯一）、来源登记
    content_retention_days；附录 B.5 schema.ledger 改为 8。结构版本 7 夹具由 `go run ./tests/fixtures/ledger/cmd/gen
    -version 7` 生成，带 ≥3 条正文恰好 16384 字节的邮件事件、托管型与自有型材料、带授权单的 Event、一个外部外发范围未选择的 v0.1
    来源，manifest.json 含 ACT-WBENV-03 列出的全部键，并登记为冻结版本。
  reviewer: omac-reviewer
  contract:
    objective: 一次迁移把账本结构由 7 升到 8，收齐 WB-01–WB-08 的全部表、列与索引（旧行不改写，新列按“没有”读），并交付冻结的结构版本
      7 合成夹具与 7→8 升级链、失败回滚测试
    non_goals:
    - 不实现原文落盘、导入、链接型材料、保留期清除等业务读写；只建结构并保证旧二进制拒绝打开升级后账本
    - 不实现其他节点负责的 action；跨节点只经已合入的命令模型、HTTP API 与本 DAG 声明的产物协作
    - 不新增本迭代设计（附录 A–D、changes-v0.2.0 第十节）之外的命令、路由、事件类型、配置项或退出码；与设计冲突时先提设计修改（§17.3
      退出码表不加行）
    - 替身、夹具、测试时钟与迁移失败注入只进测试构建与测试目录，不进发布构建的生产路径，也不作为生产降级或假数据兜底
    - 不连接真实模型端点、真实宿主、真实渠道账号或真实邮箱/提醒事项工具；L14–L24 由本人在升级后执行，不进本节点
    - 红线：内核不出现笔记应用、邮件工具或宿主名，不 import connectors；示例里不写本机路径、真实邮箱与内网地址
    - 去掉规划标记时只动本节点条目所在的行（附录 B、C）；为加标志拆出的行并回原行并删掉拆出的行（OMAC-NOTES §4）
    verification_commands:
    - go build ./...
    - go build -tags apa_testclock ./...
    - go test -count=1 ./kernel/store/...
    - go test -tags apa_testclock -count=1 ./tests/fixtures/...
    - go test -count=1 ./kernel/invariants/...
    - go test -count=1 ./tests/conformance/ ./cli/serve/
    - go run ./tools/redline
    integration_gates:
    - name: schema-v8-gate
      layer: L1
      source_of_truth:
      - docs/changes-v0.2.0.md#101-账本结构全部收在结构版本-7--8-一次迁移里
      - docs/solution-design.md#165-备份升级回退与卸载
      - docs/solution-design.md#204-v020发布门槛
      - docs/appendix-b-api-cli.md#b5-协议与版本
      - docs/solution-design.md#610-source-登记来源事件ingest
      - docs/solution-design.md#67-event-与-actor
      delivery_goal: 一次迁移把账本结构由 7 升到 8，收齐 WB-01–WB-08 的全部表、列与索引（旧行不改写，新列按“没有”读），并交付冻结的结构版本
        7 合成夹具与 7→8 升级链、失败回滚测试
      covers:
