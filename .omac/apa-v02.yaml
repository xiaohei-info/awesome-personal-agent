    - 不在本节点实现其他节点负责的 action；需要时在 PR 说明里写明依赖
    - 替身、夹具、测试时钟与迁移失败注入只进测试构建与测试目录，不进入发布构建的生产路径
    - 不为通过验收而接触真实模型端点、真实宿主、真实渠道账号或测试邮箱日历仓库（本轮只做替身验收）
    verification_commands:
