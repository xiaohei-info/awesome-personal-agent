    - go run ./tools/redline
    - go test -count=1 ./tests/conformance/ ./cli/serve/
    - go test -count=1 ./kernel/clock/...
    - go test -tags apa_testclock -count=1 ./kernel/clock/...
    - go test -tags apa_testclock -count=1 ./api/core/... ./kernel/background/...
      ./kernel/webhook/... ./kernel/runidentity/... ./kernel/attention/...
    - go test -count=1 ./tools/redline/...
    integration_gates:
    - name: test-clock-gate
      layer: L1
      source_of_truth:
      - .omac/apa-v02.design/OMAC-NOTES.md#21-替身
      - docs/solution-design.md#77-内核基础设施
      - docs/appendix-b-api-cli.md#b5-协议与版本
      delivery_goal: 测试时钟 TEST_CLOCK：apa_testclock 构建的只增偏移时间源；实现了附录 B/C.14 中带【规划中（v0.2.0）】的哪个条目，就在同一
        PR 去掉其标记（REQ-G1-5），对照测试通过
