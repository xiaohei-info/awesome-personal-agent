      上跑全量 `go test -tags e2e -count=1 -timeout 40m ./tests/e2e/...` 的 job，并让该 PR
      的真实 CI（含新 job）通过
    non_goals:
    - 不改业务代码与测试；确属用例自身缺陷的，在 PR 说明里列出并经 OMAC 缺陷反馈回流对应节点，不修改、跳过或过滤测试
    - 不改现有 build job 的步骤与命令
    - '不去掉或修改触发器上的 paths-ignore: [''.omac/**'']'
