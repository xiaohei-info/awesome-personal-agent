      delivery_goal: '新 e2e job 满足：触发与现有一致（push: main、pull_request，paths-ignore 不变）且与
        build 并行；actions/checkout 用 fetch-depth: 0（fetch-v01.sh 读冻结提交，浅克隆 exit 3）；setup-go（go-version-file:
        go.mod）、setup-node 22 + npm --prefix web ci + npm --prefix web run build（e2e
        需 web/dist/index.html）、sudo apt-get install -y sqlite3（真实 CLI）、python3 + pytest；命令
        go test -tags e2e -count=1 -timeout 40m ./tests/e2e/...；timeout-minutes: 50；concurrency
        按 ref 分组并 cancel-in-progress 取消旧运行。该 PR 的真实 GitHub CI（含新 job）通过即为本门判据。取舍：全量约
        7.5 分钟起（开发机），2 vCPU runner 预计 15–30 分钟，仍在 PR 上跑全量而不按改动路径选包——每个 e2e 包构建整套真实二进制，kernel
        任何改动都在其依赖闭包内，按路径选包会重新漏掉跨组回归；成本由 concurrency 取消与和 build 并行控制。若用例在纯 Linux runner
        上因缺宿主工具不稳定，须在本节点内查清并修复运行环境（安装依赖等），不能靠跳过。'
      covers:
