nodes:
- id: ledger-schema-v3
  worker: omac-worker-backend
  blocked_by: []
  title: 账本结构版本 3：v0.2.0 全部新表新列一次收齐
  description: 产出 ledger-schema-v3-delivery。负责 5 个 business-action（flow-upgrade-rollback）。要点：关键路径里程碑：合入即"结构版本
    3"首次可被真实账本应用，合入前按 §6 一次收齐各组表与列（判断记录、计划日期、进展、建议信息、外发范围、默认项目、指标上一次取值、合并键、静音、登录会话有效期、关联键域）；之后的结构变更各自另起迁移。迁移整体事务化：任一步失败整体回滚；测试构建提供
    APA_TEST_MIGRATION_FAIL_AFTER=<n> 注入（REQ-ENV-MIGFAULT，发布构建不生效）；旧二进制打开新版本账本拒绝启动（版本闸）。
  reviewer: omac-reviewer
  contract:
    objective: 交付账本结构版本 3：v0.2.0 全部新表新列一次收齐，使本节点负责的 5 条 business-action 在替身环境下按验收文档
      expected 可复现通过
    non_goals:
    - 不改动本节点 objective 以外的业务模块语义；跨模块协作只经命令模型与已有 HTTP API
    - 不新增本轮之外的命令、路由、事件类型或配置项；契约以附录 B/C 为准，与设计冲突时先提设计修改
    - 不修改已被真实账本应用过的迁移；结构变更只经 ledger-schema-v3 或另起新迁移并在说明里写明
    - 不在本节点实现其他节点负责的 action；需要时在 PR 说明里写明依赖
    - 替身、夹具、测试时钟与迁移失败注入只进测试构建与测试目录，不进入发布构建的生产路径
    - 不为通过验收而接触真实模型端点、真实宿主、真实渠道账号或测试邮箱日历仓库（本轮只做替身验收）
    verification_commands:
    - go build ./...
    - go run ./tools/redline
    - go test -count=1 ./tests/conformance/ ./cli/serve/
    - go test -count=1 ./kernel/store/...
    - go test -count=1 ./kernel/invariants/...
    integration_gates:
    - name: ledger-schema-v3-gate
      layer: L1
      source_of_truth:
      - .omac/apa-v02.design/OMAC-NOTES.md#12-建议在-w0-之后先落一个账本结构版本-3节点
      - docs/solution-design.md#616-判断记录
      - docs/solution-design.md#63-item事项
      - docs/solution-design.md#610-source-登记来源事件ingest
      - docs/solution-design.md#165-备份升级回退与卸载
      - docs/appendix-b-api-cli.md#b5-协议与版本
      - docs/appendix-b-api-cli.md#b6-v020-对已有契约的改动
      - .omac/apa-v02.design/OMAC-NOTES.md#52-升级必须满足
      delivery_goal: 账本结构版本 3：v0.2.0 全部新表新列一次收齐；实现了附录 B/C.14 中带【规划中（v0.2.0）】的哪个条目，就在同一
        PR 去掉其标记（REQ-G1-5），对照测试通过
      covers:
      - ACT-UPG-05
      - ACT-UPG-06
      - ACT-UPG-14
      - ACT-UPG-15
      - ACT-UPG-19
      acceptance_refs:
      - flow-upgrade-rollback
      commands:
      - go test -count=1 ./tests/conformance/ ./cli/serve/
      - go test -count=1 ./kernel/store/...
      - go test -count=1 ./kernel/invariants/...
    pr_base: main
    acceptance_contributions:
    - flow_id: flow-upgrade-rollback
      action_ids:
      - ACT-UPG-05
      - ACT-UPG-06
      - ACT-UPG-14
      - ACT-UPG-15
      - ACT-UPG-19
    acceptance_refs:
    - flow-upgrade-rollback
    source_of_truth:
    - .omac/apa-v02.design/OMAC-NOTES.md#12-建议在-w0-之后先落一个账本结构版本-3节点
    - docs/solution-design.md#616-判断记录
    - docs/solution-design.md#63-item事项
    - docs/solution-design.md#610-source-登记来源事件ingest
    - docs/solution-design.md#165-备份升级回退与卸载
    - docs/appendix-b-api-cli.md#b5-协议与版本
    - docs/appendix-b-api-cli.md#b6-v020-对已有契约的改动
    - .omac/apa-v02.design/OMAC-NOTES.md#52-升级必须满足
    scope_paths:
    - kernel/store/**
