- id: test-clock
  worker: omac-worker-backend-oracle
  blocked_by: []
  title: 测试时钟 TEST_CLOCK：apa_testclock 构建的只增偏移时间源
  description: 产出 test-clock-delivery。要点：代码里已有的 Now 注入点（至少 api/core、kernel/background、kernel/webhook、kernel/runidentity、kernel/attention）统一接到
    kernel/clock 的时钟提供者，这些跨包接线文件及其测试是本节点的 supporting files；只在 apa_testclock 构建里读 <APA_HOME>/test-clock-offset，只增、每次调整记服务日志、不新增
    Event、无需重启并立即重算到期。验证要求：(1) 上列每个被接线的包在 -tags apa_testclock 下各有包级断言"写偏移后该包取到的 Now
    前进、到期立即重算"；(2) 扩展 tools/redline（及其测试）作为失败即暴露的守卫，禁止 kernel/clock 以外的生产代码直接调用 time.Now；(3)
    不带 apa_testclock 标签时偏移文件不生效的负向测试（kernel/clock 默认构建测试）。本节点只提供"当前二进制是否为测试时钟构建"的布尔来源（test-clock-build-flag）；apa
    version / GET /version 的 test_clock 字段输出由 apa-version 节点实现。
  reviewer: omac-reviewer
  contract:
    objective: 交付测试时钟 TEST_CLOCK：apa_testclock 构建的只增偏移时间源，作为后续验收共用、可独立运行并有自测的基础能力
    non_goals:
    - 不改动本节点 objective 以外的业务模块语义；跨模块协作只经命令模型与已有 HTTP API
    - 不新增本轮之外的命令、路由、事件类型或配置项；契约以附录 B/C 为准，与设计冲突时先提设计修改
