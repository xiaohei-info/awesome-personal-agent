  description: 产出 ci-e2e-gate-delivery。在 .github/workflows/ci.yml 新增与 build 并行的全量
    -tags e2e job，让修复 PR 合并前就被跨组回归拦住。不认领验收 flow。运行顺序：由操作者 omac node hold，待 main 上已知
