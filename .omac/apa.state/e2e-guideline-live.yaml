retry_note: '负责人说明：这个节点改派到 taiyi 上的 worker（omac-worker-frontend-taiyi），本机就是 taiyi，可以直接在本机运行
  hermes，不需要 ssh。

  - hermes 只用 /opt/apa-live/bin/hermes，先读 /opt/apa-live/README.md。每次运行用 mktemp -d
  /tmp/apa-live.XXXXXX 的字面路径做独立 HERMES_HOME，从 /opt/apa-live/hermes-home 复制 config.yaml
  和 .env，模型凭据就在里面，不需要 hermes pm repair。

  - 凭据用 set -a; . /opt/apa-live/creds/live.env; set +a 加载，不打印。

  - 红线：不碰 /root/.hermes、taiyi 上的容器、aiteam-*、nginx，不重启服务，只允许删除 /tmp/apa-live.* 下的目录。

  - <TEST_REPO> 用 xiaohei-info/apa-live-test。它是 APA live 专用的测试仓库，可以往默认分支推 AGENTS.md
  的提交。它是私有仓库，不是公开仓库；如果合约要求公开仓库，就在报告里写明这个差异，然后用它继续。taiyi 上的 gh 没有它的写权限的话，作为阻塞上报，写明缺什么权限。

  - 验收标准不放宽，发现产品缺陷照常上报。'
