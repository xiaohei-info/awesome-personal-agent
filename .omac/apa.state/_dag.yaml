    - class: design-gap
      suspected_node: e2e-delivery
      anchors:
      - flow-delivery-control/ACT-DLV-07
      design_ref: docs/solution-design.md#69-delivery
      expected: '按 §6.9 投递状态表与"回答即确认"（PR #243 之后的权威设计）：本人在 Web 回答时，被回答的那条决策投递转 acknowledged，不记
        superseded；作废只作用于低于被回答版本的旧投递，旧版本的 ack 返回 409（kernel Stale → api/deliveries
        409）。TestDLV07 要验证的是"事项变化后旧投递作废、领取不到旧版本、旧版本 ack 为 409、不进 Web 未读"，用例必须构造出真正的旧版本：先让事项产生一条投递
        （版本 v），再让事项变化产生更高版本（例如再次 ask 产生新的决策请求版本，或用非本人确认的变化：超时默认值），使 v 成为低于当前版本的旧投递，
        再对 v 断言 superseded / 领不到 / ack 409 / 不在未读。被本人回答的那条投递应断言为 acknowledged（不是 superseded）。
        只改 tests/e2e/delivery，不改内核实现，不改 .omac 下的验收文档。'
      observed: 'release-closeout（PR #247）在 linux/amd64 跑 go test -tags e2e ./tests/e2e/delivery：TestDLV07
        对已在 Web 回答的同一版本 POST /v1/deliveries/{id}/ack {"version":v}（未带 external_ref）期望
        409，实际 400 "external_ref is required"。原因：PR #243 之后被回答的投递转 acknowledged 而非
        superseded，Queue.check 不判 Stale，走到 Ack 的 external_ref 校验。用例写于 PR #178，早于 #243
        的设计变更，没有同步。'
      locations:
      - tests/e2e/delivery/flows_test.go:TestDLV07
      - kernel/delivery/delivery.go:Queue.Ack（只读参考，不改）
    - class: design-gap
