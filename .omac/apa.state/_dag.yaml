      anchors:
      - flow-bg-task-runner/ACT-BGT-04
      design_ref: docs/solution-design.md#77-内核基础设施
      expected: '按 §7.7 运行上下文文件与 §17.4（PR #237 之后）：CLI 设了 APA_RUN_CONTEXT 时以文件为准，盖过环境里的
        APA_RUN/APA_URL/APA_TOKEN； PATH 带运行标记却没有 APA_RUN_CONTEXT 时报未认证；设了 APA_RUN
        时绝不回退本机凭据文件。ACT-BGT-04 要证明的是"运行内拿不到运行凭据时 不回退到 apa login 保存的本机凭据、退出码 3"，用例必须把运行凭据的所有来源都去掉（APA_TOKEN、APA_RUN_CONTEXT、APA_RUN_CREDENTIAL_FILE），
        保留 APA_RUN 与本机凭据文件，再断言 apa inbox 退出码 3；对照组（去掉 APA_RUN 等运行变量）仍为 0。只改 tests/e2e/bgguards，
        不改 cli/ 实现，不改 .omac 下的验收文档。'
      observed: 'release-closeout（PR #247）在 linux/amd64 跑 go test -tags e2e ./tests/e2e/bgguards：TestFlowBgTaskRunner/ACT-BGT-04
        的 `env -u APA_TOKEN $APA inbox` 退出码 0，期望 3。原因：PR #237 之后内核给运行注入 APA_RUN_CONTEXT，cli/client/credentials.go:withRunContext
        从上下文文件取运行凭据，用例只清 APA_TOKEN，CLI 用的是运行凭据而不是本机凭据，属于用例未跟上设计。用例写于 PR #192，早于 #237。'
      locations:
      - tests/e2e/bgguards/taskrunner_test.go:TestFlowBgTaskRunner（ACT-BGT-04 步骤）
      - cli/client/credentials.go:withRunContext（只读参考，不改）
